name: Agent CI Gate

# Integration gate for the BA -> Architect -> Developer -> QA worktree
# roster (AGENTS.md §2). Runs on any agent/issue-* branch and on PRs whose
# head branch matches, so a Developer agent's push and a QA agent's PR both
# hit the same checks before scripts/agent-workspace.sh complete opens or
# merges anything.

on:
  push:
    branches:
      - "agent/issue-*"
  pull_request:
    branches:
      - main

jobs:
  gate:
    # For push events this checks the ref name; for pull_request events
    # GitHub Actions can't filter `on:` by head branch pattern, so the same
    # condition is re-checked here against github.head_ref.
    if: |
      startsWith(github.ref_name, 'agent/issue-') ||
      startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require TASK_SCOPE.md
        run: |
          if [[ ! -f TASK_SCOPE.md ]]; then
            echo "::error::TASK_SCOPE.md is missing at repo root. The BA agent must author it before this branch can pass the gate (AGENTS.md §2)." >&2
            exit 1
          fi
          if grep -qE '\[ID\]|\[What is the user trying to achieve\?\]' TASK_SCOPE.md; then
            echo "::error::TASK_SCOPE.md still has unfilled template placeholders — the BA agent must complete it, not just check in the blank template." >&2
            exit 1
          fi
          # A non-placeholder TASK_SCOPE.md isn't necessarily the RIGHT
          # one -- found on the issue-13 test run, where a worktree
          # branched with the previous issue's already-filled-in scope
          # file still in place and this check passed anyway. Cross-check
          # the branch name's issue id against the file's own header.
          BRANCH_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ISSUE_ID="${BRANCH_NAME#agent/issue-}"
          if ! grep -qF "ISSUE #${ISSUE_ID}" TASK_SCOPE.md; then
            echo "::error::TASK_SCOPE.md doesn't mention 'ISSUE #${ISSUE_ID}' (branch ${BRANCH_NAME}) -- this looks like a stale scope file left over from a different issue, not one written for this branch." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: LWC Jest suite
        run: npm test

      - name: Static reference / instrument drift audit
        run: |
          # check-references.py's deploy-blocking count is not currently
          # zero on main (issue #33) -- three long-standing findings that no
          # agent branch introduced were failing every PR identically
          # (confirmed on PRs #20, #27, #28). Failing on the raw count makes
          # the gate a permanent red X rather than a signal, so this diffs
          # this branch's findings against main's own and fails only on ones
          # this branch adds. --list-blocking prints one sorted, stable line
          # per deploy-blocking finding for exactly this purpose.
          # check-references.py resolves ROOT/SRC relative to its own file
          # location, so the baseline run needs to be an actual checkout of
          # main, not just the old script pointed at this branch's tree (nor
          # this branch's *new* --list-blocking flag run against a copy of
          # the old script, which predates that flag and wouldn't understand
          # it). Give main a real worktree and run THIS branch's script --
          # the one with --list-blocking -- against it.
          git fetch origin main --depth=1
          git worktree add --detach /tmp/main-baseline origin/main
          cp scripts/check-references.py /tmp/main-baseline/scripts/check-references.py
          python3 /tmp/main-baseline/scripts/check-references.py --list-blocking > /tmp/blocking-main.txt || true
          git worktree remove --force /tmp/main-baseline
          python3 scripts/check-references.py --list-blocking > /tmp/blocking-head.txt || true
          NEW_FINDINGS="$(comm -13 <(sort /tmp/blocking-main.txt) <(sort /tmp/blocking-head.txt))"
          if [[ -n "$NEW_FINDINGS" ]]; then
            echo "::error::This branch introduces deploy-blocking findings that are not on main:"
            echo "$NEW_FINDINGS"
            echo "(main's own pre-existing findings, if any, are not this branch's problem to fix.)"
            exit 1
          fi
          echo "No new deploy-blocking findings vs. main. Full report for context:"
          python3 scripts/check-references.py || true

          # build-instrument.py --check is all-or-nothing too, in principle,
          # but CI/agent worktrees never have an ma-migrator checkout, so
          # rule 5 (cited paths exist) cannot run without one. The repo's
          # own documented pattern for exactly this context is
          # --allow-missing-source-root (docs/runbooks/fresh-org-deploy.md
          # row A4; docs/agent-artifacts/issue-16-architecture.md), which
          # skips rule 5 and lets the other 10 rules gate the build. Verified
          # this passes cleanly (0 findings) on both origin/main and this
          # branch before adding it here -- do not drop the flag without
          # provisioning an ma-migrator checkout in this workflow first.
          python3 scripts/build-instrument.py --check --allow-missing-source-root

      - name: Set up Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to gtm-dev (JWT)
        id: sf_auth
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          if [[ -z "$SF_JWT_KEY" || -z "$SF_CONSUMER_KEY" || -z "$SF_USERNAME" ]]; then
            echo "::warning::SF_JWT_KEY / SF_CONSUMER_KEY / SF_USERNAME secrets are not configured — skipping the metadata dry-run. Deploy validation is not actually running until these are set on the repo (Settings > Secrets and variables > Actions)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SF_JWT_KEY" > server.key
          sf org login jwt \
            --client-id "$SF_CONSUMER_KEY" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "${SF_INSTANCE_URL:-https://login.salesforce.com}" \
            --alias ci-gate
          rm -f server.key
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate metadata (dry run — no org changes)
        if: steps.sf_auth.outputs.skip == 'false'
        run: |
          sf project deploy start \
            --source-dir force-app/main/default \
            --target-org ci-gate \
            --dry-run \
            --ignore-conflicts
