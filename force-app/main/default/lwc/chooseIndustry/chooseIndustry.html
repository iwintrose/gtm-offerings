<template>
  <div class={rootClass}>
    <template if:true={_loadError}>
      <div class="load-error" role="status">{_loadError}</div>
    </template>


    <div class="bar">
      <div class="bar-wm">
        <span class="tick"></span> {brandLabel}
        <span class="bar-tag mono">{brandTag}</span>
      </div>
      <div class="bar-right">
        <a class="bar-back mono" href={offeringsUrl}>← offerings</a>
        <c-ma-saved-links-bar></c-ma-saved-links-bar>
        <button class="tbtn" title="Theme" onclick={handleThemeToggle}>◐</button>
      </div>
    </div>

    <div class="wrap">
      <div class="eyebrow"><span class="bead"></span> {eyebrow}</div>
      <template if:true={_editMode}>
        <a href={builderUrl} target="_blank" rel="noopener" class="hd-edit-chip">
          Edit page layout in Experience Builder ↗
        </a>
      </template>
      <h1>{headline}</h1>
      <p class="sub">{subhead}</p>

      <div class="grid">
        <template for:each={industries} for:item="ind">
          <div key={ind.key} class={ind.wrapClass}>
            <a class="tile" href={ind.href}>
              <div class="tile-name">{ind.label}</div>
              <div class="tile-desc">{ind.desc}</div>
              <div class="tile-go">Configure for this industry →</div>
            </a>
            <template if:true={_editMode}>
              <button class="cedit-btn" data-id={ind.key} onclick={handleChipClick}>✎ Edit</button>
              <div class={ind.popClass} onclick={handlePopClick}>
                <div class="pop-hd">
                  <div class="pop-name">{ind.label}</div>
                  <div class="pop-id">{ind.indexRecordId}</div>
                </div>
                <div class="pop-acts">
                  <a href={ind.cmsUrl} target="_blank" rel="noopener" class="pop-act pop-act--cms">
                    <span class="picon"></span>Edit CMS content ↗
                  </a>
                  <a href={ind.builderUrl} target="_blank" rel="noopener" class="pop-act pop-act--bld">
                    <span class="picon"></span>Edit page layout ↗
                  </a>
                  <a href={ind.indexUrl} target="_blank" rel="noopener" class="pop-act pop-act--rec">
                    <span class="picon"></span>View index record ↗
                  </a>
                </div>
              </div>
            </template>
          </div>
        </template>

        <a class="tile skip" href={skipHref}>
          <div class="tile-name">Skip for now</div>
          <div class="tile-desc">
            Start from the generic version and pick an industry later in the
            Customize panel.
          </div>
          <div class="tile-go">Continue without one →</div>
        </a>
      </div>

      <div class="footnote">
        This picks a starting point for the configurator, not a locked-in
        choice. Company name, industry, and branding all stay editable on the
        next page through the Customize panel.
      </div>
    </div>

    <footer class="pf">
      <span>{footerLeft}</span>
      <span>{footerRight}</span>
    </footer>
  </div>
</template>
