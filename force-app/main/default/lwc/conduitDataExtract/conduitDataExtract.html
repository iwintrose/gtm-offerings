<template>
    <lightning-card title="Customer Data Extract" icon-name="standard:file">
        <div class="slds-card__body slds-card__body_inner slds-p-horizontal_medium slds-p-top_small slds-p-bottom_x-small">
            <p class="slds-text-body_small slds-text-color_weak">
                Upload the customer's raw platform export (.zip) — Conduit ingests it,
                assembles a Canonical Marketing Model, and uses the newest active version
                for every audit, migration plan, and AI analysis on this record.
            </p>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-p-around_medium">

            <!-- Upload -->
            <div class="slds-m-bottom_medium">
                <lightning-file-upload
                    label={uploadLabel}
                    name="cmm-upload"
                    accept={acceptedFormats}
                    record-id={recordId}
                    onuploadfinished={handleUploadFinished}
                    disabled={isBusy}>
                </lightning-file-upload>
                <p class="upload-hint slds-m-top_x-small">
                    Zip of the customer's raw platform export folder. Max 5 MB. Supported source
                    platforms currently: Pardot / Marketing Cloud Account Engagement, Eloqua.
                </p>
            </div>

            <!-- Busy spinner -->
            <template lwc:if={isBusy}>
                <div class="slds-text-align_center slds-m-bottom_medium">
                    <lightning-spinner alternative-text="Ingesting…" size="small"></lightning-spinner>
                    <p class="slds-m-top_x-small slds-text-color_weak">
                        Uploading &amp; ingesting…
                    </p>
                </div>
            </template>

            <!-- Global error -->
            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                    {error}
                </div>
            </template>

            <!-- Empty state -->
            <template lwc:if={isEmpty}>
                <p class="slds-text-body_regular slds-text-color_weak slds-text-align_center slds-p-around_medium">
                    No extracts uploaded yet — analysis is running against the default demo fixture.
                </p>
            </template>

            <!-- Version list -->
            <template lwc:if={hasVersions}>
                <h3 class="section-heading">EXTRACT VERSIONS</h3>
                <ul class="version-list">
                    <template for:each={versions} for:item="v">
                        <li key={v.Id} class={v.rowClass}>
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-6">
                                    <p class="version-num">v{v.Version__c}</p>
                                    <p class="version-name">{v.Name}</p>
                                </div>
                                <div class="slds-col slds-size_3-of-6">
                                    <p class="version-meta">
                                        <span class="version-platform">{v.Source_Platform__c}</span>
                                        <span class="meta-sep">·</span>
                                        <span>{v.uploadedAtFormatted}</span>
                                        <span class="meta-sep">·</span>
                                        <span>by {v.uploadedByName}</span>
                                    </p>
                                    <template lwc:if={v.Object_Counts__c}>
                                        <p class="version-counts">{v.Object_Counts__c}</p>
                                    </template>
                                    <template lwc:if={v.hasError}>
                                        <p class="version-error">{v.Error_Message__c}</p>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_2-of-6 slds-text-align_right">
                                    <span class={v.statusClass}>{v.Status__c}</span>
                                    <template lwc:if={v.activateDisabled}>
                                        <span class={v.activateClass}>{v.activateLabel}</span>
                                    </template>
                                    <template lwc:else>
                                        <button
                                            class={v.activateClass}
                                            data-id={v.Id}
                                            onclick={handleActivate}>
                                            {v.activateLabel}
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

        </div>
    </lightning-card>
</template>
