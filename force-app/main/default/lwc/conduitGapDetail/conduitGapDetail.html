<template>
    <lightning-card title="Gap Analysis" icon-name="utility:warning">
        <div class="slds-card__body slds-card__body_inner slds-p-horizontal_medium slds-p-top_small slds-p-bottom_x-small">
            <p class="slds-text-body_small slds-text-color_weak">{subtitle}</p>
        </div>

        <!-- ── Initial ───────────────────────────────────────────────── -->
        <template lwc:if={showInitial}>
            <div class="slds-card__body slds-card__body_inner slds-p-around_medium">
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                    Includes AI remediation — expect ~15 seconds.
                </p>
                <lightning-button label="Run Gap Analysis" variant="brand" onclick={handleRunGapDetail}>
                </lightning-button>
            </div>
        </template>

        <!-- ── Loading ───────────────────────────────────────────────── -->
        <template lwc:if={isLoading}>
            <div class="slds-card__body slds-card__body_inner slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Analysing…" size="medium"></lightning-spinner>
                <p class="slds-m-top_medium slds-text-heading_small">Analysing structural gaps…</p>
                <p class="slds-text-color_weak slds-m-top_x-small">Claude is writing remediation guidance</p>
            </div>
        </template>

        <!-- ── Error ─────────────────────────────────────────────────── -->
        <template lwc:if={error}>
            <div class="slds-card__body slds-card__body_inner slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">{error}</div>
                <lightning-button label="Retry" onclick={handleRunGapDetail}></lightning-button>
            </div>
        </template>

        <!-- ── Results ───────────────────────────────────────────────── -->
        <template lwc:if={hasData}>
            <div class="slds-card__body slds-card__body_inner slds-p-around_medium">

                <!-- Summary bar -->
                <div class="gap-summary-bar slds-m-bottom_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-text-align_center">
                            <p class="gap-count gap-blocker-color">{gapData.bySeverity.blocker}</p>
                            <p class="gap-count-label">Blockers</p>
                        </div>
                        <div class="slds-col slds-text-align_center">
                            <p class="gap-count gap-warning-color">{gapData.bySeverity.warning}</p>
                            <p class="gap-count-label">Warnings</p>
                        </div>
                        <div class="slds-col slds-text-align_center">
                            <p class="gap-count gap-info-color">{gapData.bySeverity.info}</p>
                            <p class="gap-count-label">Info</p>
                        </div>
                        <div class="slds-col slds-text-align_center">
                            <p class="gap-count">{gapData.total}</p>
                            <p class="gap-count-label">Total</p>
                        </div>
                    </div>
                </div>

                <!-- AI assessment callout -->
                <template lwc:if={hasSummary}>
                    <div class="ai-callout slds-m-bottom_medium">
                        <p class="ai-callout-label">AI ASSESSMENT <span class="ai-badge">Claude</span></p>
                        <p class="ai-callout-text">{gapData.summary}</p>
                    </div>
                </template>

                <!-- Severity filter -->
                <div class="filter-bar slds-m-bottom_medium">
                    <template for:each={severityFilters} for:item="f">
                        <button key={f.value} class={f.cls} onclick={handleSeverityFilter} data-filter={f.value}>{f.label}</button>
                    </template>
                </div>

                <!-- Gap list -->
                <p class="gap-showing slds-m-bottom_x-small">Showing {filteredGaps.length} of {gapData.total} gaps</p>
                <ul class="gap-list">
                    <template for:each={filteredGaps} for:item="gap">
                        <li key={gap.sourceCanonicalId} class="gap-item">
                            <div class="slds-grid slds-gutters_x-small gap-header">
                                <div class="slds-col">
                                    <span class="gap-entity-name">{gap.entityName}</span>
                                    <span class="gap-wave-tag slds-m-left_x-small">{gap.wave}</span>
                                </div>
                                <div class="slds-col slds-shrink">
                                    <span class={gap.severityClass}>{gap.severity}</span>
                                </div>
                            </div>
                            <p class="gap-reason">{gap.reason}</p>
                            <template lwc:if={gap.hasRemediation}>
                                <div class="gap-remediation">
                                    <span class="remediation-label">Remediation: </span>{gap.remediation}
                                </div>
                            </template>
                        </li>
                    </template>
                </ul>

                <!-- Footer -->
                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button label={buttonLabel} variant="neutral" onclick={handleRunGapDetail}>
                    </lightning-button>
                </div>

            </div>
        </template>

    </lightning-card>
</template>
