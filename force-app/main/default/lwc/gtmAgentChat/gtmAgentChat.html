<template>
    <div class="chat-container">
        <div class="messages" lwc:ref="messageList">
            <template for:each={visibleMessages} for:item="msg">
                <div key={msg.id} class={msg.cssClass}>
                    <div class="bubble">{msg.text}</div>
                    <template lwc:if={msg.effect}>
                        <button type="button" class="slds-button slds-button_neutral effect-btn"
                                data-id={msg.id} onclick={handleEffectClick}>{msg.effectLabel}</button>
                    </template>
                </div>
            </template>
            <template if:true={thinking}>
                <div class="message assistant">
                    <div class="bubble thinking">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </template>
        </div>
        <div class="input-row">
            <textarea
                class="chat-input"
                placeholder={placeholder}
                value={draft}
                onchange={handleDraftChange}
                onkeydown={handleKeyDown}
                disabled={inputDisabled}
            ></textarea>
            <button class="slds-button slds-button_icon slds-button_icon-brand send-btn" onclick={handleSend} disabled={sendDisabled} aria-label="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
</template>
