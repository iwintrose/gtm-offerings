<template>
    <div class="slds-p-around_medium slds-max-width_medium">
        <h1 class="slds-text-heading_medium slds-m-bottom_small">Analytics Notifications</h1>
        <p class="slds-text-body_regular slds-m-bottom_medium">
            Send every rep who owns an engagement link a weekly email summary of their own Analytics numbers.
        </p>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template if:true={loadError}>
            <div class="slds-text-color_error slds-m-bottom_small">{loadError}</div>
        </template>

        <template if:false={isLoading}>
            <lightning-input
                type="toggle"
                label="Send weekly Analytics email"
                message-toggle-active="On"
                message-toggle-inactive="Off"
                checked={digestEnabled}
                disabled={isSaving}
                onchange={handleToggle}
            ></lightning-input>

            <template if:true={digestEnabled}>
                <div class="slds-grid slds-gutters slds-m-top_medium slds-m-bottom_small">
                    <div class="slds-col">
                        <lightning-combobox label="Day" value={digestDayOfWeek} options={dayOptions} onchange={handleDayChange}></lightning-combobox>
                    </div>
                    <div class="slds-col">
                        <lightning-combobox label="Time" value={hourValue} options={hourOptions} onchange={handleHourChange}></lightning-combobox>
                    </div>
                </div>
            </template>

            <p class="slds-text-body_small slds-text-color_weak slds-m-top_small slds-m-bottom_medium">{nextRunDescription}</p>

            <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center" style="gap: 0.75rem;">
                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
                <template if:true={saveMessage}>
                    <span class="slds-text-color_success slds-text-body_small">{saveMessage}</span>
                </template>
            </div>
        </template>
    </div>
</template>
