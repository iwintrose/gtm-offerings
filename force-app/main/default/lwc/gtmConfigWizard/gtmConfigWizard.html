<template>
  <c-gtm-modal-shell is-open={isOpen} title={headerLabel} chrome-offset={standalone} onclose={handleClose}>
    <div class="mw-progress" slot="header-extras"><div class="mw-progress-fill" style={progressStyle}></div></div>
    <template if:true={showFull}>
      <template if:false={isDone}>
        <div class="mw-dotrow" slot="header-extras" role="tablist" aria-label="Jump to a step">
          <template for:each={stepDots} for:item="d">
            <button
              key={d.n}
              type="button"
              class={d.dotClass}
              data-step={d.n}
              title={d.label}
              aria-label={d.label}
              onclick={handleStepJump}
            >{d.n}</button>
          </template>
        </div>
      </template>
    </template>

    <div class="mw-scroll">

        <!-- ══════════ PATH CHOOSER ══════════ -->
        <template if:true={showChooser}>
          <div class="mw-choice">
            <button type="button" class="mw-choice-card primary" onclick={handleChooseQuick}>
              <span class="mw-choice-badge">Fastest</span>
              <span class="mw-choice-title">Quick link</span>
              <span class="mw-choice-sub">Two questions, then send. Everything else defaults.</span>
            </button>
            <button type="button" class="mw-choice-card" onclick={handleChooseFull}>
              <span class="mw-choice-title">Full walkthrough</span>
              <span class="mw-choice-sub">All the details — brand colour, real numbers, a note.</span>
            </button>
          </div>
        </template>

        <!-- ══════════ QUICK LINK ══════════ -->
        <template if:true={showQuick}>
          <template if:false={isDone}>
            <div class="mw-step">
              <p class="mw-q">Company, and roughly what industry?</p>
              <div class="mw-field">
                <input
                  class="mw-input"
                  placeholder="e.g. Metrolinx"
                  value={_company}
                  oninput={handleQuickCompanyInput}
                  aria-invalid={_companyInvalid}
                />
              </div>
              <div class="mw-chiprow">
                <template for:each={industryChips} for:item="ind">
                  <button key={ind.key} type="button" class={ind.chipClass} data-key={ind.key} onclick={handleQuickIndustryPick}>{ind.label}</button>
                </template>
                <button type="button" class={genericChipClass} data-key="" onclick={handleQuickIndustryPick}>Not sure</button>
              </div>
              <template if:true={quickAccountNote}>
                <p class="mw-deal-note">{quickAccountNote}</p>
              </template>
              <template if:true={quickNeedsContactEmail}>
                <div class="mw-field">
                  <label class="mw-label">Prospect contact email</label>
                  <input
                    type="email"
                    class="mw-input"
                    value={quickContactEmailValue}
                    oninput={handleQuickContactEmailInput}
                    placeholder="so we can find or create a Contact for this company"
                    aria-invalid={quickContactEmailInvalid}
                  />
                  <template if:true={quickContactEmailInvalid}>
                    <p class="mw-error">Enter a valid email.</p>
                  </template>
                </div>
              </template>
              <template for:each={platformFields} for:item="pf">
                <div key={pf.key} class="mw-field">
                  <label class="mw-label">{pf.label}</label>
                  <select class="mw-input mw-platform" data-key={pf.key} onchange={handlePlatformSelect}>
                    <template for:each={pf.options} for:item="opt">
                      <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                    </template>
                  </select>
                  <template if:true={pf.showOther}>
                    <input class="mw-input mw-platform-other" data-key={pf.key} value={pf.otherValue} oninput={handlePlatformOtherInput} placeholder="Type the platform name" />
                  </template>
                </div>
              </template>
              <p class="mw-hint">Blank uses the offering's default platform.</p>
              <template if:true={_saveError}>
                <div class="mw-error" role="alert">{_saveError}</div>
              </template>
              <div class="mw-actions">
                <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleBackToChooser}>← Back</button>
                <button type="button" class="slds-button slds-button_brand mw-btn" onclick={handleQuickGenerate} disabled={quickGenerateDisabled}>Generate link →</button>
              </div>
              <p class="mw-hint">Brand colour, proof numbers, and a password are filled in automatically.</p>
            </div>
          </template>
        </template>

        <!-- ══════════ FULL WALKTHROUGH ══════════ -->
        <template if:true={showFull}>
          <template if:false={isDone}>

            <!-- STEP 1 — company -->
            <template if:true={isStep1}>
              <div class="mw-step">
                <p class="mw-q">Who's this page for?</p>
                <div class="mw-field">
                  <input
                    class="mw-input"
                    placeholder="Type a company or contact name"
                    value={_company}
                    oninput={handleCompanyInput}
                    aria-invalid={_companyInvalid}
                  />
                </div>
                <template if:true={hasContactResults}>
                  <div class="mw-chiprow">
                    <template for:each={contactResults} for:item="c">
                      <button key={c.id} type="button" class="mw-chip" data-id={c.id} onclick={handleSelectContact}>{c.summary}</button>
                    </template>
                  </div>
                </template>
                <template if:true={_selectedContact}>
                  <div class="mw-selected">
                    {selectedContactSummary}
                    <button type="button" class="mw-mini-link" onclick={handleChangeContact}>Change</button>
                  </div>

                </template>

                <!-- Visible confirm-or-create gate (issue account-contact-
                     confirm): no existing Contact picked above -> the rep
                     must see and confirm what will be created before Step 1
                     is considered done. -->
                <template if:true={showNewContactConfirm}>
                  <div class="mw-confirm-new">
                    <p class="mw-hint">{confirmNewContactCopy}</p>
                    <div class="mw-field">
                      <label class="mw-label">Contact name</label>
                      <input class="mw-input" value={confirmedNewContactNameValue} oninput={handleConfirmedNewContactNameInput} />
                    </div>
                    <div class="mw-field">
                      <label class="mw-label">Contact email</label>
                      <input
                        type="email"
                        class="mw-input"
                        value={confirmedNewContactEmailValue}
                        oninput={handleConfirmedNewContactEmailInput}
                        aria-invalid={confirmedNewContactEmailInvalid}
                      />
                      <template if:true={confirmedNewContactEmailInvalid}>
                        <p class="mw-error">Enter a valid email.</p>
                      </template>
                    </div>
                    <template if:false={_accountContactConfirmed}>
                      <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleConfirmNewContact} disabled={confirmNewContactDisabled}>Confirm</button>
                    </template>
                    <template if:true={_accountContactConfirmed}>
                      <p class="mw-hint">Confirmed — a new Account/Contact will be created for {_company}.</p>
                    </template>
                  </div>
                </template>

                <!-- Which deal. A client can have several at once, so this
                     asks instead of quietly creating another one. Shown
                     whether the account came from a chosen contact or from a
                     typed company name. -->
                <template if:true={hasDeals}>
                  <div>
                    <p class="mw-q mw-q--sub">Which deal is this link for?</p>
                    <div class="mw-deals">
                      <template for:each={dealOptions} for:item="d">
                        <button key={d.id} type="button" class={d.cls}
                                data-id={d.id} onclick={handlePickDeal}>
                          <span class="mw-deal-name">{d.name}</span>
                          <span class="mw-deal-meta">{d.meta}</span>
                        </button>
                      </template>
                      <button type="button" class={newDealClass} onclick={handlePickNewDeal}>
                        <span class="mw-deal-name">A new deal</span>
                        <span class="mw-deal-meta">Creates one for this client</span>
                      </button>
                    </div>
                    <template if:true={matchedAccountNote}>
                      <p class="mw-deal-note">{matchedAccountNote}</p>
                    </template>
                    <template if:true={dealWarning}>
                      <p class="mw-deal-warn" role="status">{dealWarning}</p>
                    </template>
                    <template if:true={showNewDealWarning}>
                      <p class="mw-deal-warn" role="status">{newDealWarning}</p>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- STEP 2 — industry -->
            <template if:true={isStep2}>
              <div class="mw-step">
                <p class="mw-q">What industry are they in?</p>
                <div class="mw-chiprow">
                  <template for:each={industryChips} for:item="ind">
                    <button key={ind.key} type="button" class={ind.chipClass} data-key={ind.key} onclick={handleIndustryPick}>{ind.label}</button>
                  </template>
                  <button type="button" class={genericChipClass} data-key="" onclick={handleIndustryPick}>Not sure — use general content</button>
                </div>
              </div>
            </template>

            <!-- STEP 3 — brand colour -->
            <template if:true={isStep3}>
              <div class="mw-step">
                <p class="mw-q">Match their brand colour</p>
                <div class="mw-field">
                  <input class="mw-input" placeholder="Their website (optional), e.g. acme.com" value={_brandDomain} oninput={handleBrandDomainInput} />
                </div>
                <div class="mw-actions" style="margin-top:0;">
                  <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleBrandLookup} disabled={_brandLookupBusy}>Look up →</button>
                </div>
                <template if:true={_brandLookupError}>
                  <div class="mw-error" role="alert">{_brandLookupError}</div>
                </template>
                <div class="mw-swatchrow">
                  <span class="mw-swatch mw-swatch-current" style={accentSwatchStyle}></span>
                  <template for:each={_swatches} for:item="sw">
                    <button key={sw.hex} type="button" class="mw-swatch" data-hex={sw.hex} style={sw.style} title={sw.name} onclick={handleSwatch}></button>
                  </template>
                </div>
              </div>
            </template>

            <!-- STEP 4 — environment size -->
            <template if:true={isStep4}>
              <div class="mw-step">
                <p class="mw-q">Roughly how big is their setup?</p>
                <template for:each={platformFields} for:item="pf">
                  <div key={pf.key} class="mw-field">
                    <label class="mw-label">{pf.label}</label>
                    <select class="mw-input mw-platform" data-key={pf.key} onchange={handlePlatformSelect}>
                      <template for:each={pf.options} for:item="opt">
                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                      </template>
                    </select>
                    <template if:true={pf.showOther}>
                      <input class="mw-input mw-platform-other" data-key={pf.key} value={pf.otherValue} oninput={handlePlatformOtherInput} placeholder="Type the platform name" />
                    </template>
                  </div>
                </template>
                <template if:false={_envAdvanced}>
                  <div class="mw-presetrow">
                    <template for:each={sizeCards} for:item="s">
                      <button key={s.key} type="button" class={s.cardClass} data-key={s.key} onclick={handleSizePick}>
                        <b>{s.letter}</b>{s.sub}
                      </button>
                    </template>
                  </div>
                </template>
                <template if:true={_envAdvanced}>
                  <div class="mw-field">
                    <label class="mw-label">Assets mapped</label>
                    <input class="mw-input" value={assetsValue} data-key="ASSET_COUNT" oninput={handleEnvFieldInput} />
                  </div>
                  <div class="mw-field">
                    <label class="mw-label">Dependencies traced</label>
                    <input class="mw-input" value={depsValue} data-key="DEPENDENCY_COUNT" oninput={handleEnvFieldInput} />
                  </div>
                  <div class="mw-field">
                    <label class="mw-label">Health score (0-100)</label>
                    <input class="mw-input" value={healthValue} data-key="HEALTH_SCORE" oninput={handleEnvFieldInput} />
                  </div>
                </template>
                <button type="button" class="mw-mini-link" onclick={handleEnvAdvancedToggle}>{envAdvancedToggleLabel}</button>
              </div>
            </template>

            <!-- STEP 5 — note -->
            <template if:true={isStep5}>
              <div class="mw-step">
                <p class="mw-q">Anything specific to mention?</p>
                <div class="mw-field">
                  <textarea
                    class="mw-input mw-textarea"
                    rows="3"
                    placeholder="e.g. We know their Q3 renewal timeline — here's how we'd de-risk it."
                    value={noteValue}
                    oninput={handleNoteInput}
                  ></textarea>
                </div>
              </div>
            </template>

            <!-- STEP 6 — your details -->
            <template if:true={isStep6}>
              <div class="mw-step">
                <p class="mw-q">Confirm your details</p>
                <div class="mw-field">
                  <label class="mw-label">Your name</label>
                  <input class="mw-input" value={contactNameValue} data-key="CONTACT_NAME" oninput={handleContactFieldInput} />
                </div>
                <div class="mw-field">
                  <label class="mw-label">Your email</label>
                  <input class="mw-input" value={contactEmailValue} data-key="CONTACT_EMAIL" oninput={handleContactFieldInput} />
                </div>
                <div class="mw-field">
                  <label class="mw-label">Booking link (optional)</label>
                  <input class="mw-input" value={bookingUrlValue} data-key="BOOKING_URL" oninput={handleContactFieldInput} />
                </div>
              </div>
            </template>

            <!-- STEP 7 — password -->
            <template if:true={isStep7}>
              <div class="mw-step">
                <p class="mw-q">This link requires a password to open</p>
                <div class="mw-field">
                  <input class="mw-input" readonly value={passwordDisplay} />
                </div>
                <div class="mw-chiprow">
                  <button type="button" class={passwordKeepClass} onclick={handlePasswordKeep}>Keep this password</button>
                  <button type="button" class={passwordCustomClass} onclick={handlePasswordCustom}>Set my own</button>
                </div>
                <template if:true={showCustomPasswordInput}>
                  <div class="mw-field">
                    <input class="mw-input" value={_customPassword} oninput={handleCustomPasswordInput} autocomplete="off" />
                  </div>
                </template>
                <div class="mw-field">
                  <label class="mw-label">Send assessment alerts to</label>
                  <input
                    type="email"
                    class="mw-input"
                    value={notifyEmailValue}
                    oninput={handleNotifyEmailInput}
                    placeholder="you@publicissapient.com"
                    autocomplete="off"
                  />
                  <template if:true={notifyEmailInvalid}>
                    <p class="mw-error">Enter a valid email, or clear this to use your own.</p>
                  </template>
                  <template if:false={notifyEmailInvalid}>
                    <p class="mw-hint">Defaults to you. Change it to route this link's assessment requests to someone else.</p>
                  </template>
                </div>
              </div>
            </template>

            <!-- STEP 8 — preview & send -->
            <template if:true={isStep8}>
              <div class="mw-step">
                <p class="mw-q">Looks good? Save to generate the link.</p>
                <p class="mw-hint">You'll be able to copy it, and keep refining anything from Saved Links afterward.</p>
                <template if:true={_saveError}>
                  <div class="mw-error" role="alert">{_saveError}</div>
                </template>
                <template if:false={_saveError}>
                  <template if:false={canGenerateLink}>
                    <div class="mw-hint">{generateBlockedReason}</div>
                  </template>
                </template>
              </div>
            </template>

            <!-- Open-duplicate prompt (issue #32) -- server-enforced block,
                 this is only the UX for it. Shown wherever a save was
                 attempted and GtmOpenOpportunityDuplicateCheck found an
                 already-open Opportunity for this Account+Contact+Offering. -->
            <template if:true={hasOpenDuplicate}>
              <div class="mw-open-duplicate" role="alertdialog" aria-label="Open deal already exists">
                <p class="mw-q">There's already an open deal for this account and offering: "{openDuplicateName}".</p>
                <p class="mw-hint">Continue with that deal, or create a new one anyway -- if the name collides, it'll automatically get today's date appended so the two are easy to tell apart.</p>
                <div class="mw-actions">
                  <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleCancelDuplicatePrompt}>Cancel</button>
                  <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleCreateNewAnyway}>Create new anyway</button>
                  <button type="button" class="slds-button slds-button_brand mw-btn" onclick={handleContinueWithExisting}>Continue with existing</button>
                </div>
              </div>
            </template>

            <div class="mw-actions">
              <template if:true={canGoBackFull}>
                <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleFullBack}>← Back</button>
              </template>
              <button type="button" class="slds-button slds-button_neutral mw-btn mw-change-path" onclick={handleBackToChooser}>← Change path</button>
              <template if:true={showSkip}>
                <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleFullSkip}>Skip</button>
              </template>
              <button type="button" class="slds-button slds-button_brand mw-btn" onclick={handleFullNext} disabled={nextDisabled}>{nextLabel}</button>
            </div>
          </template>
        </template>

        <!-- ══════════ DONE ══════════ -->
        <template if:true={isDone}>
          <div class="mw-step mw-done">
            <p class="mw-q">{doneHeadline}</p>
            <template if:true={doneSubline}>
              <p class="mw-done-sub">{doneSubline}</p>
            </template>
            <div class="mw-linkbox">
              <input class="mw-url" readonly value={previewUrl} />
              <!-- Neutral, not brand: "Done" below is this screen's one true
                   primary action (closing out the wizard); copying the link
                   is a secondary utility, not the CTA. -->
              <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleCopyLink}>{_copyFeedback}</button>
            </div>
            <!-- Quick Link never shows STEP 7 (Full-only), so the Done screen
                 is the only place a Quick Link rep can learn the password a
                 prospect will need. passwordDisplay already resolves for both
                 paths (saveConfiguration() consumes it either way), so this
                 just surfaces it here too, unconditionally of which path
                 was taken. -->
            <template if:true={passwordDisplay}>
              <div class="mw-field">
                <label class="mw-label">Password</label>
                <input class="mw-input" readonly value={passwordDisplay} />
              </div>
            </template>
            <template if:true={showPreviewLink}>
              <a class="mw-mini-link" href={previewHref} target="_blank" rel="noopener">Preview the page ↗</a>
            </template>
            <div class="mw-actions">
              <template if:true={showEditDetails}>
                <button type="button" class="slds-button slds-button_neutral mw-btn" onclick={handleEditDetails}>Edit the details</button>
              </template>
              <template if:true={showDoneChangePath}>
                <button type="button" class="slds-button slds-button_neutral mw-btn mw-change-path" onclick={handleBackToChooser}>← Change path</button>
              </template>
              <button type="button" class="slds-button slds-button_brand mw-btn" onclick={handleFinish}>Done</button>
            </div>
          </div>
        </template>

      </div>
  </c-gtm-modal-shell>
</template>
