<template>
  <div class="gcm">

    <c-gtm-page-header icon-name="utility:page" eyebrow="Content"
                      title="Content Manager" meta={headerMeta}>
    </c-gtm-page-header>

    <!-- toolbar: offering is the top of the hierarchy, page sits under it -->
    <header class="gcm-bar">
      <span class="gcm-brand">
        <lightning-icon icon-name="utility:page" size="x-small"></lightning-icon>
        GTM Content Manager
      </span>
      <span class="gcm-sep"></span>

      <lightning-combobox
        label="Offering"
        variant="label-hidden"
        placeholder="Choose an offering"
        value={selectedOffering}
        options={offeringOptions}
        onchange={handleOfferingChange}
        class="gcm-pick">
      </lightning-combobox>

      <template if:true={hasTemplate}>
        <lightning-icon icon-name="utility:chevronright" size="xx-small" class="gcm-crumb-sep"></lightning-icon>
        <button class="gcm-crumb" onclick={handleBackToPages}>All pages</button>
        <lightning-icon icon-name="utility:chevronright" size="xx-small" class="gcm-crumb-sep"></lightning-icon>
        <!-- A picker, not a label: moving between an offering's pages is the
             same kind of move as changing offering, so it costs the same. -->
        <lightning-combobox
          label="Page"
          variant="label-hidden"
          value={selectedTemplate}
          options={pageOptions}
          onchange={handlePageChange}
          class="gcm-pick gcm-pick--page">
        </lightning-combobox>
        <!-- A stand-alone surface, not a row in the Sections rail: these
             values (swatches, size presets) drive the rep's link wizard, not
             this page, so they get their own reach point beside the page
             picker rather than sitting in the ordinary content list. -->
        <template if:true={hasSettingsSection}>
          <button class="gcm-crumb gcm-settings-btn" onclick={handleOpenSettingsPanel}
                  title="Swatches and size presets used by the rep's link wizard">
            <lightning-icon icon-name="utility:settings" size="xx-small"></lightning-icon>
            <span>Customizer settings</span>
          </button>
        </template>
      </template>

      <span class={saveStateClass} title="Edits save as a draft while you type">
        <span class="gcm-save-dot"></span>{saveStateLabel}
      </span>

      <div class="gcm-bar-right">
        <!-- Grouped the way Salesforce groups list-view actions: related
             buttons share one pill, the primary action sits apart from it. -->
        <lightning-button-group>
          <template if:true={canReorder}>
            <lightning-button
              label={reorderLabel}
              variant={reorderVariant}
              onclick={handleToggleReorder}>
            </lightning-button>
          </template>
          <lightning-button label="Refresh"
                            title="Reload this page from the org. Nothing is discarded."
                            onclick={handleRefresh}></lightning-button>
        </lightning-button-group>
        <template if:true={hasDrafts}>
          <div class="gcm-changes">
            <button class="gcm-drafts" onclick={handleToggleChanges}
                    title="What is not yet on the live page">
              <span class="gcm-drafts-dot"></span>{draftSummary}
              <span class="gcm-drafts-caret">&#9662;</span>
            </button>
            <template if:true={changesOpen}>
              <div class="chgpop">
                <div class="chgpop-h">
                  <span>Not yet published</span>
                  <button class="chgpop-x" onclick={handleCloseChanges} title="Close" aria-label="Close">&times;</button>
                </div>
                <ul class="chgpop-list">
                  <template for:each={pendingChanges} for:item="c">
                    <li key={c.id} class={c.kindClass}>
                      <span class="chg-where">{c.where}</span>
                      <span class="chg-what">{c.what}</span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
          <lightning-button-group>
            <lightning-button label="Save &amp; exit"
                              title="Leave the editor and keep the draft unpublished"
                              onclick={handleSaveAndExit}></lightning-button>
            <lightning-button
              label="Publish"
              variant="brand"
              title="Replace the live page with this draft"
              onclick={handleOpenExit}>
            </lightning-button>
          </lightning-button-group>
        </template>
      </div>
    </header>

    <template if:true={loadError}>
      <div class="gcm-error" role="alert">
        <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon>
        <span>{loadError}</span>
        <button class="gcm-error-x" onclick={handleDismissError} title="Dismiss" aria-label="Dismiss">&times;</button>
      </div>
    </template>

    <template if:true={isNewOffering}>
      <div class="gcm-new-hint" role="status">
        <lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon>
        <span>This is your new offering's <b>Story</b> — its front door. When it's built, its <b>Offerings Listing</b> tile (already started for you) is what shows it off in the shared offerings list.</span>
        <button class="gcm-new-hint-x" onclick={handleDismissNewOfferingHint} title="Dismiss" aria-label="Dismiss">&times;</button>
      </div>
    </template>

    <template if:true={isLoading}>
      <div class="gcm-loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
    </template>

    <!-- no offering chosen yet -->
    <template if:false={hasOffering}>
      <template if:false={isLoading}>
        <div class="gcm-empty">
          <p><b>Choose an offering to begin.</b></p>
          <p class="gcm-empty-sub">
            Each offering has its own pages, sections and content.
          </p>
          <template if:true={hasOnlyFramework}>
            <p class="gcm-empty-sub">Only the Framework exists so far. Use New offering on Content Home to add one.</p>
          </template>
        </div>
      </template>
    </template>

    <!-- offering chosen: pick a page -->
    <template if:true={showPagePicker}>
      <div class="gcm-pages">
        <h2 class="gcm-pages-h">Pages in {offeringLabel}</h2>
        <div class="pg-grid">
          <template for:each={templates} for:item="t">
            <button key={t.templateType} class={t.cardClass}
                    data-template={t.templateType} onclick={handlePickTemplate}>
              <span class="pg-name">{t.label}</span>
              <span class="pg-sum">{t.summary}</span>
              <template if:false={t.isBuilt}>
                <span class="pg-flag">Empty</span>
              </template>
            </button>
          </template>
        </div>
        <p class="gcm-empty-sub gcm-pages-note">
          A page becomes editable once its structure exists as Page Section
          records. Pages showing no sections still render from their component's
          built-in defaults.
        </p>
        <!-- A lone Framework is auto-selected on load, so the empty state above
             never renders for it; the hint has to live here to be seen. -->
        <template if:true={hasOnlyFramework}>
          <p class="gcm-empty-sub gcm-pages-note">Only the Framework exists so far. Use New offering on Content Home to add one.</p>
        </template>
      </div>
    </template>

    <!-- page chosen: the editor -->
    <template if:true={showEditor}>
      <template if:true={noSections}>
        <div class="gcm-empty">
          <p><b>This page has no sections yet.</b></p>
          <p class="gcm-empty-sub">
            A page is its sections. Add the first one and the editor opens on it;
            nothing is public until you publish.
          </p>
          <lightning-button label="Add the first section" variant="brand"
                            icon-name="utility:add" class="gcm-empty-cta"
                            onclick={handleOpenAdd}></lightning-button>
        </div>
      </template>

      <template if:true={hasSections}>
        <div class="gcm-cols">

          <aside class="gcm-rail">
            <template if:true={settingsOpen}>
              <!-- Settings mode: one fixed section, not a list -- no drag,
                   reorder, add or delete chrome, just a way back. -->
              <div class="gcm-colhead">
                <button class="gcm-crumb gcm-settings-back" onclick={handleCloseSettingsPanel}>
                  &larr; Back to page content
                </button>
              </div>
              <div class="gcm-settings-note">
                <p class="gcm-settings-note-h">Customizer settings — {offeringLabel}</p>
                <p class="gcm-empty-sub">
                  Swatches and size presets a rep sees while configuring a link
                  for this offering. Not drawn on this page itself.
                </p>
              </div>
            </template>
            <template if:false={settingsOpen}>
              <div class="gcm-colhead">
                <span>Sections</span><span class="gcm-count">{sectionCount}</span>
                <button class="gcm-industry-toggle" onclick={handleToggleIndustryView}>
                  <lightning-icon icon-name="utility:world" size="x-small"></lightning-icon>
                  {industryViewLabel}
                </button>
              </div>

              <template if:true={industryView}>
                <div class="gcm-industry-picker">
                  <lightning-combobox label="Industry" variant="label-hidden"
                                       placeholder="Choose an industry"
                                       value={industryFilterKey}
                                       options={industryViewOptions}
                                       onchange={handleIndustryFilterChange}></lightning-combobox>
                  <template if:true={industryViewError}>
                    <p class="modal-note gcm-industry-error" role="alert">{industryViewError}</p>
                  </template>
                </div>
                <template if:true={hasIndustryFilter}>
                  <p class="gcm-hint">
                    Showing every section's status for this industry. Drag to
                    reorder for this industry only; the generic order and
                    every other industry are unaffected.
                  </p>
                  <div class="gcm-rail-body">
                    <template for:each={industryRailSections} for:item="s">
                      <div key={s.sectionKey} class={s.itemClass} data-key={s.sectionKey}
                           draggable="true" onclick={handleSelectSection}
                           ondragstart={handleIndustryDragStart} ondragover={handleIndustryDragOver}
                           ondrop={handleIndustryDrop}>
                        <lightning-icon icon-name={s.icon} size="x-small" class="sec-icon"></lightning-icon>
                        <div class="sec-main">
                          <span class="sec-name">{s.label}</span>
                          <span class={s.statusClass}>{s.statusLabel}</span>
                        </div>
                        <template if:true={s.hasVariant}>
                          <button class="mv" data-key={s.variantSectionKey} onclick={handleIndustryOpenVariant}
                                  title="Open this industry's variant" aria-label="Open this industry's variant">
                            &rarr;
                          </button>
                        </template>
                        <button class="mv" data-key={s.sectionKey} onclick={handleIndustryToggleHidden}
                                title={s.toggleLabel} aria-label={s.toggleLabel}>&#9679;</button>
                      </div>
                    </template>
                  </div>
                </template>
                <template if:false={hasIndustryFilter}>
                  <p class="gcm-hint">Choose an industry to see this page's status for it.</p>
                </template>
              </template>

              <template if:false={industryView}>
              <div class="gcm-rail-body">
                <template for:each={railSections} for:item="s">
                  <div key={s.sectionKey} class={s.itemClass} data-key={s.sectionKey}
                       draggable={reorderMode} onclick={handleSelectSection}
                       ondragstart={handleDragStart} ondragover={handleDragOver} ondrop={handleDrop}>
                    <lightning-icon icon-name={s.icon} size="x-small" class="sec-icon"></lightning-icon>
                    <div class="sec-main">
                      <span class="sec-name">{s.label}</span>
                      <span class="sec-meta">{s.layoutLabel} &middot; {s.fieldCount} fields</span>
                      <template if:true={s.hasPending}>
                        <span class="sec-pending">{s.pendingLabel}</span>
                      </template>
                    </div>
                    <template if:true={s.isDirty}><span class="sec-dot" title="Unsaved"></span></template>
                    <template if:true={reorderMode}>
                      <span class="sec-move">
                        <button class="mv" data-key={s.sectionKey} onclick={handleMoveUp}
                                disabled={s.isFirst} title="Move up" aria-label="Move section up">&uarr;</button>
                        <button class="mv" data-key={s.sectionKey} onclick={handleMoveDown}
                                disabled={s.isLast} title="Move down" aria-label="Move section down">&darr;</button>
                        <button class="mv" data-key={s.sectionKey} onclick={handleToggleActive}
                                title={s.toggleLabel} aria-label={s.toggleLabel}>&#9679;</button>
                        <template if:true={s.canDelete}>
                          <button class="mv mv--danger" data-key={s.sectionKey} onclick={handleAskDelete}
                                  title="Delete this section" aria-label="Delete this section">&times;</button>
                        </template>
                        <template if:true={s.canRestore}>
                          <button class="mv mv--undo" data-key={s.sectionKey} onclick={handleRestore}
                                  title="Undo the pending delete" aria-label="Undo the pending delete">&#8630;</button>
                        </template>
                      </span>
                    </template>
                    <button class="sec-variant-add" data-key={s.sectionKey} onclick={handleOpenVariant}
                            title="Add an industry variant of this section"
                            aria-label="Add an industry variant of this section">+ Industry variant</button>
                  </div>
                  <template for:each={s.variants} for:item="v">
                    <div key={v.sectionKey} class={v.itemClass} data-key={v.sectionKey}
                         onclick={handleSelectSection}>
                      <lightning-icon icon-name="utility:world" size="x-small" class="sec-icon"></lightning-icon>
                      <div class="sec-main">
                        <span class="sec-name">{v.label} &middot; {v.industryKey}</span>
                        <span class="sec-meta">{v.layoutLabel} &middot; {v.fieldCount} fields</span>
                        <template if:true={v.hasPending}>
                          <span class="sec-pending">{v.pendingLabel}</span>
                        </template>
                      </div>
                      <template if:true={v.isDirty}><span class="sec-dot" title="Unsaved"></span></template>
                      <template if:true={reorderMode}>
                        <span class="sec-move">
                          <button class="mv" data-key={v.sectionKey} onclick={handleToggleActive}
                                  title={v.toggleLabel} aria-label={v.toggleLabel}>&#9679;</button>
                          <template if:true={v.canDelete}>
                            <button class="mv mv--danger" data-key={v.sectionKey} onclick={handleAskDelete}
                                    title="Delete this variant" aria-label="Delete this variant">&times;</button>
                          </template>
                          <template if:true={v.canRestore}>
                            <button class="mv mv--undo" data-key={v.sectionKey} onclick={handleRestore}
                                    title="Undo the pending delete" aria-label="Undo the pending delete">&#8630;</button>
                          </template>
                        </span>
                      </template>
                    </div>
                  </template>
                </template>
              </div>
              <div class="gcm-rail-foot">
                <template if:true={isIndustryPage}>
                  <button class="gcm-add" onclick={handleOpenIndustry} disabled={isSaving}>
                    <lightning-icon icon-name="utility:office" size="x-small"></lightning-icon>
                    Add industry
                  </button>
                </template>
                <template if:false={isIndustryPage}>
                  <button class="gcm-add" onclick={handleOpenAdd} disabled={isSaving}>
                    <span class="gcm-add-plus">+</span> Add section
                  </button>
                </template>
                <p class="gcm-hint">{railHint}</p>
              </div>
              </template>
            </template>
          </aside>

          <template if:true={canOpenDraftWithAi}>
            <div class="gcm-draft-ai-bar">
              <button class="gcm-draft-ai-btn" onclick={handleOpenDraftWithAi} disabled={isSaving}>
                <lightning-icon icon-name="utility:einstein" size="x-small"></lightning-icon>
                Draft with AI
              </button>
            </div>
          </template>

          <c-gtm-field-editor
            class="gcm-fields"
            records={records}
            active-key={activeKey}
            section-label={activeSectionLabel}
            section-help={activeSectionHelp}
            section-address={activeAddress}
            layout-type={activeLayoutType}
            industry-key={activeIndustryKey}
            offering-key={selectedOffering}
            template-type={selectedTemplate}
            busy={isSaving}
            onvaluechange={handleFieldValueChange}
            onfieldschanged={handleFieldsChanged}
            onpresentationchange={handleFieldPresentationChange}
            onerror={handleChildError}>
          </c-gtm-field-editor>


          <div class="gcm-split" role="separator" aria-orientation="vertical"
               title="Drag to resize the editor column" onpointerdown={handleSplitDown}></div>

          <c-gtm-page-preview
            class="gcm-preview"
            offering-key={selectedOffering}
            sections={previewSections}
            content={previewContent}
            field-meta={previewFieldMeta}
            page-url={livePageUrl}
            template-type={selectedTemplate}
            has-drafts={hasDrafts}
            active-key={activeKey}
            settings-mode={settingsOpen}
            onsectionchange={handlePreviewSectionChange}>
          </c-gtm-page-preview>

        </div>
      </template>
    </template>
    <template if:true={addOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="addTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="addTitle">Add a section</h2>
            <p>A layout decides what the section can hold. Its fields are created with it.</p>
          </header>
          <div class="modal-b">
            <!-- A page whose renderer draws no section sequence has nothing to
                 add: its content comes from elsewhere. Saying so beats an
                 empty grid and a disabled button. -->
            <template if:false={hasLayoutOptions}>
              <p class="modal-note">{noLayoutsReason}</p>
            </template>
            <div class="cards">
              <template for:each={layoutOptions} for:item="l">
                <button key={l.value} class={l.cardClass} data-layout={l.value}
                        onclick={handleAddLayoutChange}>
                  <span class="card-h">
                    <lightning-icon icon-name={l.icon} size="x-small"></lightning-icon>
                    {l.label}
                  </span>
                  <span class="card-hint">{l.hint}</span>
                  <span class="card-count">{l.fieldLabel}</span>
                </button>
              </template>
            </div>
            <lightning-input label="Heading" value={addLabel} placeholder="For example: The mechanism"
                             onchange={handleAddLabelChange}></lightning-input>
            <template if:true={addKeyPreview}>
              <p class="modal-addr">{addKeyPreview}</p>
            </template>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCloseAdd}></lightning-button>
            <lightning-button label="Add section" variant="brand" disabled={canAddSectionDisabled}
                              onclick={handleCreateSection}></lightning-button>
          </footer>
        </div>
      </section>
    </template>

    <template if:true={industryOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="indTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="indTitle">Add an industry</h2>
            <p>Give it a name. Its key is generated. Fill in the rest of its tile afterwards, then Publish to show it on the site.</p>
          </header>
          <div class="modal-b">
            <lightning-input class="gcm-industry-name" label="Industry name" value={industryName}
                             required max-length="80"
                             onchange={handleIndustryNameChange}></lightning-input>
            <template if:true={industryValidation}>
              <p class="modal-note gcm-industry-invalid">{industryValidation}</p>
            </template>
            <template if:true={industryWarning}>
              <p class="modal-note gcm-industry-warning">{industryWarning}</p>
            </template>
            <template if:true={industryError}>
              <p class="modal-note gcm-industry-error" role="alert">{industryError}</p>
            </template>
            <template if:true={industryKeyPreview}>
              <p class="modal-addr gcm-industry-key">{industryKeyPreview}</p>
              <p class="modal-addr gcm-industry-address">{industryAddressPreview}</p>
            </template>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCloseIndustry}></lightning-button>
            <lightning-button label="Add industry" variant="brand" disabled={canAddIndustryDisabled}
                              onclick={handleCreateIndustry}></lightning-button>
          </footer>
        </div>
      </section>
    </template>

    <template if:true={variantOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="varTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="varTitle">Add an industry variant</h2>
            <p>A whole copy of this section, scoped to one industry. It starts pre-filled with the section's current fields.</p>
          </header>
          <div class="modal-b">
            <template if:false={hasVariantOptions}>
              <p class="modal-note">Every industry already has a variant of this section, or there are no industries yet.</p>
            </template>
            <template if:true={hasVariantOptions}>
              <lightning-combobox label="Industry" value={variantIndustryKey}
                                   options={variantOptions}
                                   onchange={handleVariantIndustryChange}></lightning-combobox>
            </template>
            <template if:true={variantError}>
              <p class="modal-note gcm-industry-error" role="alert">{variantError}</p>
            </template>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCloseVariant}></lightning-button>
            <lightning-button label="Add industry variant" variant="brand" disabled={canAddVariantDisabled}
                              onclick={handleCreateVariant}></lightning-button>
          </footer>
        </div>
      </section>
    </template>

    <template if:true={draftAiOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="draftAiTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="draftAiTitle">Draft with AI</h2>
            <p>GUS proposes copy for this industry variant from its research brief. Nothing is saved
              until you review it in the field editor and publish.</p>
          </header>
          <div class="modal-b">
            <lightning-textarea label="Anything GUS should know? (optional)"
                                 value={draftAiPrompt}
                                 onchange={handleDraftAiPromptChange}
                                 disabled={draftAiBusy}></lightning-textarea>
            <template if:true={draftAiReply}>
              <p class="modal-note">{draftAiReply}</p>
            </template>
            <template if:true={draftAiError}>
              <p class="modal-note gcm-industry-error" role="alert">{draftAiError}</p>
            </template>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCloseDraftWithAi}
                              disabled={draftAiBusy}></lightning-button>
            <lightning-button label="Draft" variant="brand" disabled={canDraftWithAiDisabled}
                              onclick={handleDraftWithAi}></lightning-button>
          </footer>
        </div>
      </section>
    </template>

    <template if:true={deleteOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="delTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="delTitle">Delete this section?</h2>
            <p>This removes {deleteSummary}.</p>
          </header>
          <div class="modal-b">
            <template if:true={deleteIsImmediate}>
              <p class="modal-note">
                This section has never been published, so nothing on the live
                page changes and there is nothing to publish. It is removed now.
              </p>
            </template>
            <template if:false={deleteIsImmediate}>
              <p class="modal-note">
                The section is marked and stays on the live page until you
                publish. You can undo the mark until then. To take a section off
                the page but keep what is in it, hide it instead.
              </p>
            </template>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCancelDelete}></lightning-button>
            <lightning-button label={deleteConfirmLabel} class="modal-danger"
                              onclick={handleConfirmDelete}></lightning-button>
          </footer>
        </div>
      </section>
    </template>

    <template if:true={exitOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="pubTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="pubTitle">Publish to the live page?</h2>
            <p>{draftSummary} on this page. The published page has not changed yet.</p>
          </header>
          <div class="modal-b">
            <p class="modal-note">
              Publishing replaces what visitors see and keeps the previous value
              as a version you can roll back to. Discarding throws the edits away
              and leaves the live page exactly as it is.
            </p>
          </div>
          <footer class="modal-f">
            <lightning-button label="Discard changes" class="modal-danger" onclick={handleDiscard}></lightning-button>
            <lightning-button label="Keep editing" onclick={handleCloseExit}></lightning-button>
            <lightning-button label="Publish" variant="brand" onclick={handlePublish}></lightning-button>
          </footer>
        </div>
      </section>
    </template>
  </div>
</template>
