<template>
  <div class="gcp">
    <!-- Hero -->
    <section class="gcp-hero">
      <template if:true={heroEyebrow}>
        <div class="gcp-eyebrow">{heroEyebrow}</div>
      </template>
      <template if:true={heroHeadline}>
        <h1 class="gcp-headline">
          <lightning-formatted-rich-text value={heroHeadline}></lightning-formatted-rich-text>
        </h1>
      </template>
      <template if:true={heroSubheadline}>
        <p class="gcp-subheadline">
          <lightning-formatted-rich-text value={heroSubheadline}></lightning-formatted-rich-text>
        </p>
      </template>
    </section>

    <!-- Problem -->
    <section class="gcp-section">
      <template if:true={problemLede}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={problemLede}></lightning-formatted-rich-text>
        </p>
      </template>
      <template if:true={problemChips}>
        <div class="gcp-chips">
          <template for:each={problemChips} for:item="chip">
            <span key={chip} class="gcp-chip">{chip}</span>
          </template>
        </div>
      </template>
      <template if:true={problemClose}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={problemClose}></lightning-formatted-rich-text>
        </p>
      </template>
    </section>

    <!-- BD -->
    <section class="gcp-section">
      <template if:true={bdHead}>
        <h2 class="gcp-section-head">
          <lightning-formatted-rich-text value={bdHead}></lightning-formatted-rich-text>
        </h2>
      </template>
      <template if:true={bdLede}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={bdLede}></lightning-formatted-rich-text>
        </p>
      </template>
      <template if:true={bdUseCases}>
        <div class="gcp-use-cases">
          <template for:each={bdUseCases} for:item="useCase">
            <div key={useCase.title} class="gcp-use-case">
              <div class="gcp-use-case-title">{useCase.title}</div>
              <div class="gcp-use-case-desc">{useCase.description}</div>
            </div>
          </template>
        </div>
      </template>
      <template if:true={bdPitchOldChips}>
        <div class="gcp-chips-group">
          <div class="gcp-chips-label">Current state</div>
          <div class="gcp-chips">
            <template for:each={bdPitchOldChips} for:item="chip">
              <span key={chip} class="gcp-chip">{chip}</span>
            </template>
          </div>
        </div>
      </template>
      <template if:true={bdPitchNewChips}>
        <div class="gcp-chips-group">
          <div class="gcp-chips-label">New way</div>
          <div class="gcp-chips">
            <template for:each={bdPitchNewChips} for:item="chip">
              <span key={chip} class="gcp-chip gcp-chip-highlight">{chip}</span>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- Mechanism -->
    <section class="gcp-section">
      <template if:true={mechanismHead}>
        <h2 class="gcp-section-head">
          <lightning-formatted-rich-text value={mechanismHead}></lightning-formatted-rich-text>
        </h2>
      </template>
      <template if:true={mechanismSub}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={mechanismSub}></lightning-formatted-rich-text>
        </p>
      </template>
      <template if:true={mechanismSteps}>
        <div class="gcp-steps">
          <template for:each={mechanismSteps} for:item="step">
            <div key={step.label} class="gcp-step">
              <div class="gcp-step-label">{step.label}</div>
              <div class="gcp-step-desc">{step.description}</div>
            </div>
          </template>
        </div>
      </template>
      <template if:true={mechanismProofCtaText}>
        <p class="gcp-body gcp-proof-cta">
          <lightning-formatted-rich-text value={mechanismProofCtaText}></lightning-formatted-rich-text>
        </p>
      </template>
      <template if:true={mechanismProofDemoDeps}>
        <div class="gcp-chips">
          <template for:each={mechanismProofDemoDeps} for:item="dep">
            <span key={dep} class="gcp-chip">{dep}</span>
          </template>
        </div>
      </template>
    </section>

    <!-- Capabilities -->
    <section class="gcp-section">
      <template if:true={capabilitiesCards}>
        <div class="gcp-cards">
          <template for:each={capabilitiesCards} for:item="card">
            <div key={card.title} class="gcp-card">
              <h3 class="gcp-card-title">{card.title}</h3>
              <p class="gcp-card-desc">{card.description}</p>
            </div>
          </template>
        </div>
        <template if:true={capabilitiesBonusCard}>
          <div class="gcp-card gcp-card-bonus">
            <h3 class="gcp-card-title">{capabilitiesBonusCard.title}</h3>
            <p class="gcp-card-desc">{capabilitiesBonusCard.description}</p>
          </div>
        </template>
      </template>
    </section>

    <!-- Client Profile -->
    <section class="gcp-section">
      <template if:true={clientProfileStatBig}>
        <div class="gcp-stat">
          <div class="gcp-stat-big">{clientProfileStatBig}</div>
          <template if:true={clientProfileStatDesc}>
            <div class="gcp-stat-desc">{clientProfileStatDesc}</div>
          </template>
        </div>
      </template>
      <template if:true={clientProfileNote}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={clientProfileNote}></lightning-formatted-rich-text>
        </p>
      </template>
    </section>

    <!-- Closing -->
    <section class="gcp-section">
      <template if:true={closingHead}>
        <h2 class="gcp-section-head">
          <lightning-formatted-rich-text value={closingHead}></lightning-formatted-rich-text>
        </h2>
      </template>
      <template if:true={closingSub}>
        <p class="gcp-body">
          <lightning-formatted-rich-text value={closingSub}></lightning-formatted-rich-text>
        </p>
      </template>
    </section>
  </div>
</template>
