<template>
  <section class="fe">
    <div class="gcm-colhead"><span>Content</span><span class="gcm-count">{fieldCountLabel}</span></div>
    <div class="gcm-fields-body">
      <div class="gcm-sechead">
        <h2>{sectionLabel}</h2>
        <p>{sectionHelp}</p>
        <span class="gcm-addr-chip">{sectionAddress}</span>
      </div>

      <template for:each={activeFields} for:item="f">
        <div key={f.id} class={f.fieldClass}>
          <div class="fld-top">
            <span class="fld-label">{f.displayLabel}</span>
            <span class="fld-type" title={f.typeTitle}>{f.fieldType}</span>
            <span class={f.statusClass}>{f.statusLabel}</span>
            <span class="fld-acts">
              <button class={f.advClass} data-id={f.id} onclick={handleToggleAdv}
                      title="Class, id and inline style for this field">&#9881;</button>
              <button class="fa" data-id={f.id} onclick={handleFieldUp}
                      disabled={f.isFirst} title="Move field up">&uarr;</button>
              <button class="fa" data-id={f.id} onclick={handleFieldDown}
                      disabled={f.isLast} title="Move field down">&darr;</button>
              <template if:true={f.pendingDelete}>
                <button class="fa fa--undo" data-id={f.id} onclick={handleFieldRestore}
                        title="Undo the pending delete">&#8630;</button>
              </template>
              <template if:false={f.pendingDelete}>
                <button class="fa del" data-id={f.id} onclick={handleFieldDelete}
                        title="Delete this field and its record">&times;</button>
              </template>
            </span>
          </div>
          <template if:true={f.showKey}>
            <p class="fld-key">{f.fieldKey}</p>
          </template>

          <!-- plain text -->
          <template if:true={f.isTextShort}>
            <lightning-input variant="label-hidden" value={f.value}
                             data-id={f.id} data-column={f.column}
                             onchange={handleTextChange}></lightning-input>
          </template>
          <template if:true={f.isTextLong}>
            <lightning-textarea variant="label-hidden" value={f.value}
                                class="fld-area"
                                data-id={f.id} data-column={f.column}
                                onchange={handleTextChange}></lightning-textarea>
          </template>

          <!-- rich text: markup never shows in the box, and the accent command
               is the page's own, which no stock editor offers -->
          <template if:true={f.isRich}>
            <div class="rt">
              <div class="rt-bar">
                <button class="rt-b" data-id={f.id} data-cmd="bold"
                        onmousedown={handleRtGuard} onclick={handleRtCommand} title="Bold"><b>B</b></button>
                <button class="rt-b" data-id={f.id} data-cmd="italic"
                        onmousedown={handleRtGuard} onclick={handleRtCommand} title="Italic"><i>I</i></button>
                <span class="rt-sep"></span>
                <button class="rt-b rt-b--accent" data-id={f.id} data-cmd="accent"
                        onmousedown={handleRtGuard} onclick={handleRtCommand}
                        title="Tint the selection with the page accent colour">A</button>
                <button class="rt-b" data-id={f.id} data-cmd="br"
                        onmousedown={handleRtGuard} onclick={handleRtCommand}
                        title="Insert a line break">&#8629;</button>
                <span class="rt-sep"></span>
                <button class="rt-b" data-id={f.id} data-cmd="clear"
                        onmousedown={handleRtGuard} onclick={handleRtCommand}
                        title="Strip all formatting">&#10005;</button>
              </div>
              <div class="rt-in" contenteditable="true" data-id={f.id}
                   data-ph="Type here…" oninput={handleRichChange}
                   lwc:dom="manual"></div>
            </div>
          </template>

          <!-- a button is a label and an icon, edited as one thing -->
          <template if:true={f.isIconText}>
            <div class="rep">
              <label class="sub">
                <span class="sub-l">Button label</span>
                <input class="ctl tiny" value={f.button.label} data-id={f.id}
                       oninput={handleButtonLabel}>
              </label>
              <label class="sub">
                <span class="sub-l">Icon</span>
                <div class="pickrow">
                  <template for:each={f.button.icons} for:item="ic">
                    <button key={ic.value} class={ic.pickClass} data-id={f.id} data-icon={ic.value}
                            onclick={handleButtonIcon} title={ic.label}>
                      <template if:true={ic.isNone}><span class="none">none</span></template>
                      <template if:false={ic.isNone}>{ic.glyph}</template>
                    </button>
                  </template>
                </div>
              </label>
            </div>
          </template>

          <!-- structured list: one control per item, shape read from the data -->
          <!-- structured list: item shape read from the data -->
          <template if:true={f.isJson}>
            <div class="rep">
              <template for:each={f.items} for:item="item">
                <div key={item.id} class="item">
                  <div class="item-top">
                    <span class="item-n">{item.position}</span>
                    <template for:each={item.flags} for:item="flag">
                      <label key={flag.key} class={flag.toggleClass}>
                        <input type="checkbox" checked={flag.checked}
                               data-id={item.recordId} data-index={item.index} data-key={flag.key}
                               onchange={handleItemChange}>{flag.label}
                      </label>
                    </template>
                    <span class="item-acts">
                      <button class="fa" data-id={item.recordId} data-index={item.index} data-dir="up"
                              onclick={handleItemMove} disabled={item.isFirst} title="Move up">&uarr;</button>
                      <button class="fa" data-id={item.recordId} data-index={item.index} data-dir="down"
                              onclick={handleItemMove} disabled={item.isLast} title="Move down">&darr;</button>
                      <button class="fa del" data-id={item.recordId} data-index={item.index}
                              onclick={handleItemDelete} title="Delete this item">&times;</button>
                    </span>
                  </div>

                  <div class="item-grid">
                    <template if:true={item.isScalar}>
                      <input class="ctl tiny" value={item.value}
                             data-id={item.recordId} data-index={item.index} data-key="__value"
                             oninput={handleItemChange}>
                    </template>

                    <template if:true={item.hasPair}>
                      <div class="row2">
                        <template for:each={item.pair} for:item="sub">
                          <label key={sub.key} class="sub">
                            <span class="sub-l">{sub.label}</span>
                            <input class={sub.inputClass} value={sub.value}
                                   data-id={item.recordId} data-index={item.index} data-key={sub.key}
                                   oninput={handleItemChange}>
                          </label>
                        </template>
                      </div>
                    </template>

                    <template for:each={item.rest} for:item="sub">
                      <label key={sub.key} class="sub">
                        <span class="sub-l">{sub.label}</span>
                        <textarea class="ctl tiny" rows="2"
                                  data-id={item.recordId} data-index={item.index} data-key={sub.key}
                                  oninput={handleItemChange}>{sub.value}</textarea>
                      </label>
                    </template>
                  </div>
                </div>
              </template>

              <button class="addbtn" data-id={f.id} onclick={handleItemAdd}
                      title="Add another item">
                <span class="addbtn-plus">+</span> Add item
              </button>
            </div>
          </template>

          <!-- per-field presentation, written to the record -->
          <template if:true={f.advOpen}>
            <div class="adv">
              <label class="sub">
                <span class="sub-l">CSS class</span>
                <input class="ctl tiny mono" value={f.cssClass} placeholder="wide muted"
                       data-id={f.id} data-adv="cssClass" oninput={handleAdvChange}>
              </label>
              <label class="sub">
                <span class="sub-l">HTML id</span>
                <input class="ctl tiny mono" value={f.htmlId} placeholder="hero-headline"
                       data-id={f.id} data-adv="htmlId" oninput={handleAdvChange}>
              </label>
              <label class="sub">
                <span class="sub-l">Inline style</span>
                <input class="ctl tiny mono" value={f.inlineStyle} placeholder="max-width:28rem"
                       data-id={f.id} data-adv="inlineStyle" oninput={handleAdvChange}>
              </label>
              <p class="adv-note">
                Written to the record and applied to this element on render. An id
                makes the element addressable for deep links and anchors.
              </p>
            </div>
          </template>

          <template if:true={f.hasHelp}>
            <p class="fld-help">{f.helpText}</p>
          </template>

        </div>
      </template>

      <button class="gcm-add gcm-add--field" onclick={handleOpenAddField} disabled={isSaving}
              title="Add a field to this section">
        <span class="gcm-add-plus">+</span> Add field
      </button>

  <template if:true={hasMissingFields}>
        <div class="gcm-missing">
          <p class="gcm-missing-h">{missingSummary}</p>
          <p class="gcm-missing-sub">
            Until a field has a record the page falls back to a built-in
            default, which looks like content nobody can edit.
          </p>
          <div class="gcm-missing-list">
            <template for:each={missingFields} for:item="m">
              <button key={m.id} class="gcm-missing-add" data-field={m.fieldKey}
                      onclick={handleAddField} disabled={isSaving}>
                + {m.label} <span class="gcm-missing-key">{m.fieldKey}</span>
              </button>
            </template>
          </div>
        </div>
      </template>
    </div>
  </section>

  <template if:true={addFieldOpen}>
    <section role="dialog" aria-modal="true" aria-labelledby="afTitle" class="scrim">
      <div class="modal">
        <header class="modal-h">
          <h2 id="afTitle">Add a field</h2>
          <p>Adds one record to {sectionLabel}. The type decides which column it writes to.</p>
        </header>
        <div class="modal-b">
          <lightning-input label="Label" value={nfLabel} placeholder="For example: Supporting note"
                           onchange={handleNfLabel}></lightning-input>
          <lightning-input label="Field key" value={nfKey} class="mono"
                           placeholder="supportingNote" onchange={handleNfKey}></lightning-input>
          <template if:true={nfAddress}>
            <p class="modal-addr">{nfAddress}</p>
          </template>
          <lightning-combobox label="Type" value={nfType} options={fieldTypeOptions}
                              onchange={handleNfType}></lightning-combobox>
          <p class="modal-note">{nfTypeHint}</p>
          <lightning-input label="Help text (optional)" value={nfHelp}
                           placeholder="Shown under the field in this editor"
                           onchange={handleNfHelp}></lightning-input>
        </div>
        <footer class="modal-f">
          <lightning-button label="Cancel" onclick={handleCloseAddField}></lightning-button>
          <lightning-button label="Add field" variant="brand" disabled={addFieldDisabled}
                            onclick={handleCreateField}></lightning-button>
        </footer>
      </div>
    </section>
  </template>
</template>
