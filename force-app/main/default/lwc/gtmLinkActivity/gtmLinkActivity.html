<template>
    <lightning-card title="Prospect Activity" icon-name="standard:visit_templates" class="slds-m-top_small">

        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>

            <template if:false={hasConfig}>
                <div class="slds-p-around_medium slds-text-color_weak slds-text-body_small">
                    No engagement link connected to this assessment request.
                </div>
            </template>

            <template if:true={hasConfig}>

                <template if:false={hasEvents}>
                    <div class="slds-p-around_medium slds-text-color_weak slds-text-body_small">
                        No activity recorded yet.
                    </div>
                </template>

                <template if:true={hasEvents}>
                    <ul class="slds-timeline slds-p-horizontal_medium slds-p-bottom_medium">
                        <template for:each={events} for:item="evt">
                            <li key={evt.id} class="slds-timeline__item">
                                <span class="slds-assistive-text">{evt.type}</span>
                                <div class="slds-media">
                                    <div class="slds-media__figure slds-timeline__figure">
                                        <lightning-icon
                                            icon-name={evt.icon}
                                            variant={evt.variant}
                                            size="x-small"
                                            alternative-text={evt.type}>
                                        </lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                                            <div class="slds-grid slds-col slds-has-flexi-truncate">
                                                <p class="slds-truncate">
                                                    <strong>{evt.type}</strong>
                                                    <template if:true={evt.step}>
                                                        <span class="slds-text-color_weak"> &mdash; {evt.step}</span>
                                                    </template>
                                                </p>
                                            </div>
                                            <div class="slds-col slds-no-flex slds-grid slds-align-top">
                                                <p class="slds-text-body_small slds-text-color_weak timestamp">{evt.formatted}</p>
                                            </div>
                                        </div>
                                        <template if:true={evt.session}>
                                            <p class="slds-text-body_small slds-text-color_weak">Session: {evt.session}</p>
                                        </template>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>

            </template>
        </template>

    </lightning-card>
</template>
