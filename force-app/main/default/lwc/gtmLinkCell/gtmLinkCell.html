<template>
    <template if:true={isInteractive}>
        <a
            href="javascript:void(0);"
            class={cellClass}
            title={titleText}
            tabindex={tabIndex}
            onclick={handleClick}
            onkeydown={handleKeyDown}
        >{label}</a>
    </template>
    <template if:false={isInteractive}>
        <div class="gtm-link-cell_static-wrap">
            <span class={cellClass} title={titleText}>{label}</span>
            <template if:true={showBackfillHint}>
                <lightning-icon
                    icon-name="utility:warning"
                    size="xx-small"
                    variant="warning"
                    class="gtm-link-cell_backfill-hint"
                    title={backfillHintTitle}
                ></lightning-icon>
            </template>
        </div>
    </template>
</template>
