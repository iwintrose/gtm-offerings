<template>
    <template if:false={submitted}>
        <div class="recovery-form">
            <lightning-input
                type="email"
                label="Email address"
                value={email}
                onchange={handleEmailChange}
                data-id="emailInput"
            ></lightning-input>
            <template if:true={errorMessage}>
                <p class="error">{errorMessage}</p>
            </template>
            <lightning-button
                label="Send my link"
                onclick={handleSubmit}
                disabled={loading}
            ></lightning-button>
        </div>
    </template>
    <template if:true={submitted}>
        <p>If that email matches an engagement link, we've sent it to you.</p>
    </template>
</template>
