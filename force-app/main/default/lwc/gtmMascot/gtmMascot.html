<template>
  <!-- Gus, chibi proportions: big head, small body, one page held in both
       hands. The page is what keeps him tied to this product rather than
       being a generic mascot — he is holding the thing the framework makes. -->
  <svg class={svgClass} viewBox="0 0 64 72" role="img" aria-label="Gus, the GTM assistant"
       xmlns="http://www.w3.org/2000/svg">

    <!-- tuft: a small antenna with a coral bead, his one accent -->
    <path d="M32 12C32 8 34 6 36.5 5" class="tuft"/>
    <circle cx="37.5" cy="4" r="3" class="bead"/>

    <!-- body: deliberately small, so the head reads as oversized -->
    <path d="M22 56c0-5.5 4.5-10 10-10s10 4.5 10 10v6H22v-6Z" class="body"/>
    <!-- arms, curled around the page -->
    <circle cx="19.5" cy="57" r="4.5" class="body"/>
    <circle cx="44.5" cy="57" r="4.5" class="body"/>

    <!-- the page he is holding, in front of the body -->
    <rect x="23" y="52" width="18" height="16" rx="2.5" class="page"/>
    <line x1="26.5" y1="57" x2="37.5" y2="57" class="rule"/>
    <line x1="26.5" y1="61" x2="34" y2="61" class="rule"/>

    <!-- head: the whole character, basically -->
    <rect x="10" y="11" width="44" height="40" rx="18" class="head"/>

    <g class="face">
      <!-- big eyes with a highlight each: the one detail that reads as chibi
           at 28px as well as at 72px -->
      <ellipse cx="24" cy="31" rx="4.6" ry="5.4" class="eye"/>
      <ellipse cx="40" cy="31" rx="4.6" ry="5.4" class="eye"/>
      <circle cx="25.8" cy="28.8" r="1.7" class="glint"/>
      <circle cx="41.8" cy="28.8" r="1.7" class="glint"/>
      <ellipse cx="16.5" cy="38" rx="3.2" ry="2" class="blush"/>
      <ellipse cx="47.5" cy="38" rx="3.2" ry="2" class="blush"/>
      <path d="M29 40.5c1.5 2.2 4.5 2.2 6 0" class="smile"/>
    </g>
  </svg>
</template>
