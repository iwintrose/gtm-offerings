<template>
    <div class="gs-root">
        <button type="button" class="gs-new-btn" onclick={handleOpenWizard}>+ New Prospect Page</button>
        <template if:true={hasError}>
            <div class="gs-error">Couldn't load the snapshot right now.</div>
        </template>
        <template if:false={hasError}>
            <div class="gs-row">
                <template for:each={tiles} for:item="tile">
                    <div key={tile.key} class="gs-tile">
                        <div class="gs-tile-header">
                            <lightning-icon icon-name={tile.icon} size="x-small" class="gs-tile-icon"></lightning-icon>
                            <span class="gs-label">{tile.label}</span>
                        </div>
                        <div class="gs-value">{tile.value}</div>
                    </div>
                </template>
            </div>
        </template>
        <c-ma-config-wizard
            is-open={wizardOpen}
            standalone
            onclose={handleCloseWizard}
            onconfigsaved={handleWizardSaved}
        ></c-ma-config-wizard>
    </div>
</template>
