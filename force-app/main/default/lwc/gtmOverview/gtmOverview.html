<template>
  <div class="ov">
    <template if:true={loadError}>
      <div class="ov-err">{loadError}</div>
    </template>

    <div class="ov-cols">
      <!-- left: the numbers, stacked, because they are read down not across -->
      <section class="ov-col ov-col--stats">
        <h2 class="ov-h">Snapshot</h2>
        <template for:each={tiles} for:item="t">
          <div key={t.key} class="tile">
            <div class="tile-top">
              <lightning-icon icon-name={t.icon} size="x-small" class="tile-ico"></lightning-icon>
              <span class="tile-label">{t.label}</span>
            </div>
            <div class={t.valueClass}>{t.value}</div>
          </div>
        </template>
      </section>

      <!-- middle: the work waiting on someone -->
      <section class="ov-col ov-col--work">
        <h2 class="ov-h">New assessment requests</h2>
        <template if:true={hasRequests}>
          <div class="rows">
            <template for:each={requests} for:item="r">
              <a key={r.key} class="row" href={r.url}>
                <span class="row-main">
                  <span class="row-name">{r.name}</span>
                  <span class="row-meta">{r.meta}</span>
                </span>
                <span class="row-date">{r.date}</span>
              </a>
            </template>
          </div>
        </template>
        <template if:true={showEmptyRequests}>
          <p class="ov-empty">Nothing waiting. New requests from the public pages land here.</p>
        </template>
      </section>

      <!-- right: the one thing you come here to start -->
      <section class="ov-col ov-col--act">
        <h2 class="ov-h">Create</h2>
        <button class="act" onclick={handleOpenNewPage}>
          <span class="act-plus">+</span>
          <span class="act-main">
            <span class="act-label">New Offering Page</span>
            <span class="act-sub">Model a page for an offering and start editing it</span>
          </span>
        </button>
        <a class="act act--quiet" href={contentManagerUrl}>
          <span class="act-main">
            <span class="act-label">Open the Content Manager</span>
            <span class="act-sub">Edit an existing page</span>
          </span>
        </a>
      </section>
    </div>

    <!-- offerings, each linking to its own story -->
    <section class="ov-offerings">
      <h2 class="ov-h">Offerings</h2>
      <div class="cards">
        <template for:each={offerings} for:item="o">
          <div key={o.offeringKey} class="ocard">
            <div class="ocard-top">
              <span class="ocard-name">{o.label}</span>
              <span class="ocard-key">{o.offeringKey}</span>
            </div>
            <p class="ocard-sum">{o.summary}</p>
            <div class="ocard-acts">
              <template if:true={o.hasStory}>
                <a class="ocard-btn ocard-btn--primary" href={o.storyUrl}
                   target="_blank" rel="noopener">View the story &#8599;</a>
              </template>
              <button class="ocard-btn" data-offering={o.offeringKey}
                      onclick={handleEditOffering}>Edit pages</button>
            </div>
          </div>
        </template>
      </div>
      <template if:true={showEmptyOfferings}>
        <p class="ov-empty">No offerings configured. Add an MA_Offering__mdt record to create one.</p>
      </template>
    </section>

    <template if:true={newPageOpen}>
      <section role="dialog" aria-modal="true" aria-labelledby="npTitle" class="scrim">
        <div class="modal">
          <header class="modal-h">
            <h2 id="npTitle">New offering page</h2>
            <p>Pick the offering and which of its pages to build.</p>
          </header>
          <div class="modal-b">
            <lightning-combobox label="Offering" value={npOffering} options={offeringOptions}
                                onchange={handleNpOffering}></lightning-combobox>
            <lightning-combobox label="Page" value={npTemplate} options={templateOptions}
                                onchange={handleNpTemplate}></lightning-combobox>
            <p class="modal-note">{npHint}</p>
          </div>
          <footer class="modal-f">
            <lightning-button label="Cancel" onclick={handleCloseNewPage}></lightning-button>
            <lightning-button label="Open in Content Manager" variant="brand"
                              disabled={npDisabled} onclick={handleGoToPage}></lightning-button>
          </footer>
        </div>
      </section>
    </template>
  </div>
</template>
