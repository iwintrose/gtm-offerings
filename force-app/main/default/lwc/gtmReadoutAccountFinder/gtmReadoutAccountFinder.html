<template>
  <div class="raf">
    <div class="raf-head">
      <div class="raf-head-row">
        <p class="raf-head-label">Search</p>
        <div class="raf-head-search">
          <template if:false={hasPicked}>
            <div class="raf-search">
              <lightning-input
                type="search"
                label="Search"
                variant="label-hidden"
                placeholder="Search accounts or contacts by name…"
                value={searchTerm}
                onchange={handleSearchInput}
                oninput={handleSearchInput}
              ></lightning-input>
              <template if:true={showSearchResults}>
                <ul class="raf-search-results">
                  <template if:true={searching}>
                    <li class="raf-search-status"><lightning-spinner alternative-text="Searching" size="x-small"></lightning-spinner></li>
                  </template>
                  <template if:true={searchError}>
                    <li class="raf-search-status raf-search-status--err">{searchError}</li>
                  </template>
                  <template if:true={showNoResults}>
                    <li class="raf-search-status">No accounts or contacts match.</li>
                  </template>
                  <template for:each={searchResultRows} for:item="r">
                    <li key={r.key}>
                      <button type="button" class="raf-search-result" data-id={r.recordId} onclick={handleSelectSearchResult}>
                        <lightning-icon icon-name={r.iconName} size="x-small" class={r.iconClass}></lightning-icon>
                        <span class="raf-search-result-body">
                          <span class="raf-search-result-main">{r.label}</span>
                          <template if:false={r.isAccount}>
                            <span class="raf-search-result-sub">{r.subLabel}</span>
                          </template>
                        </span>
                      </button>
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </template>
          <template if:true={hasPicked}>
            <div class="raf-search-summary">
              <span class="raf-summary-label">Search</span>
              <span class="raf-summary-value">{pickedSummaryLabel}</span>
              <button type="button" class="raf-search-again" onclick={handleSearchAgain}>Search again</button>
            </div>
          </template>
        </div>
      </div>
      <template if:true={hasCrumbTrail}>
        <nav class="raf-crumbs" aria-label="Steps">
          <template for:each={crumbs} for:item="c">
            <button key={c.key} type="button" class="raf-crumb" data-key={c.key}
                    disabled={c.disabled} onclick={handleCrumbClick}>{c.label}</button>
          </template>
        </nav>
      </template>
    </div>

    <template if:true={loadError}>
      <p class="raf-msg raf-msg--err">{loadError}</p>
    </template>

    <!-- STEP 1: nothing picked yet -- the search that gets you started lives
         in the header above, same as gtmRepLinkFinder's own empty state. -->
    <template if:true={isAccountStep}>
      <div class="raf-empty-state">
        <lightning-icon icon-name="utility:search" size="large" class="raf-empty-ico"></lightning-icon>
        <p class="raf-empty-title">Search for an account or contact above</p>
        <p class="raf-empty-sub">
          Find the account or contact this assessment was filed for. Picking an
          account continues into its contacts and requests; picking a contact goes
          straight to that contact's assessment requests.
        </p>
      </div>
    </template>

    <div class="raf-columns">
      <!-- COLUMN: contact -->
      <template if:true={isContactVisible}>
        <div class={contactColumnClass}>
          <template if:true={isContactStep}>
            <template if:true={loadingRequests}>
              <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template if:false={loadingRequests}>
              <template if:true={hasContactGroups}>
                <p class="raf-step-label">Which Contact is this for?</p>
                <ul class="raf-list">
                  <template for:each={contactRows} for:item="c">
                    <li key={c.contactId}>
                      <button type="button" class="raf-row" data-id={c.contactId} onclick={handleSelectContact}>
                        <span class="raf-row-main">{c.contactName}</span>
                        <span class="raf-row-sub">{c.requestCountLabel}</span>
                      </button>
                    </li>
                  </template>
                </ul>
              </template>
              <template if:false={hasContactGroups}>
                <p class="raf-empty">
                  No assessment requests found for {accountName}. A request shows up here
                  once one is filed against a Contact on this Account.
                </p>
              </template>
            </template>
            <button type="button" class="raf-back" onclick={handleBackToAccount}>← Choose a different account</button>
          </template>
          <template if:false={isContactStep}>
            <div class="raf-summary">
              <span class="raf-summary-label">Contact</span>
              <span class="raf-summary-value">{selectedContactName}</span>
              <button type="button" class="raf-change" onclick={handleBackToContact}>change</button>
            </div>
          </template>
        </div>
      </template>

      <!-- COLUMN: request -->
      <template if:true={isRequestVisible}>
        <div class="raf-col">
          <template if:true={hasRequestRows}>
            <p class="raf-step-label">Which assessment?</p>
            <ul class="raf-list">
              <template for:each={requestRows} for:item="r">
                <li key={r.recordId}>
                  <button type="button" class="raf-row raf-row--request" data-id={r.recordId} onclick={handleSelectRequest}>
                    <span class="raf-row-top">
                      <span class="raf-row-main">{r.company}</span>
                      <span class={r.statusClass}>{r.statusLabel}</span>
                    </span>
                    <span class="raf-row-sub">{r.offeringLabel} · {r.requesterName}</span>
                    <span class="raf-row-date">Filed {r.createdLabel}</span>
                  </button>
                </li>
              </template>
            </ul>
          </template>
          <template if:false={hasRequestRows}>
            <p class="raf-empty">No assessment requests found for this Contact.</p>
          </template>
          <button type="button" class="raf-back" onclick={handleBackToContact}>← Choose a different contact</button>
        </div>
      </template>
    </div>
  </div>
</template>
