<template>
  <template if:true={_isAdmin}>
    <div class={bannerClass}>
      <div class="ab-inner">
        <div class="ab-legend">
          <span class="dot dot-cms"></span><span class="dot-lbl">CMS</span>
          <span class="dot dot-bld"></span><span class="dot-lbl">Builder</span>
          <span class="dot dot-rec"></span><span class="dot-lbl">Record</span>
        </div>
        <span class="ab-title">Admin Edit Mode — click any ✎ chip to open edit links</span>
        <button class="ab-exit" onclick={handleExit}>Exit</button>
      </div>
    </div>
    <button class={fabClass} title="Toggle admin edit mode" onclick={handleToggle}>
      <svg class="fab-icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 1.5a5.5 5.5 0 1 0 0 11A5.5 5.5 0 0 0 7 1.5ZM5.2 7h3.6M7 5.2v3.6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        <circle cx="7" cy="7" r="1.25" fill="currentColor"/>
      </svg>
      <span class="fab-lbl">{fabLabel}</span>
    </button>
  </template>
</template>
