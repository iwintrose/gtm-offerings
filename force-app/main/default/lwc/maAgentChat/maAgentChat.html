<template>
    <div class="chat-container">
        <div class="messages" lwc:ref="messageList">
            <template for:each={messages} for:item="msg">
                <div key={msg.id} class={msg.cssClass}>
                    <div class="bubble">{msg.text}</div>
                </div>
            </template>
            <template if:true={thinking}>
                <div class="message assistant">
                    <div class="bubble thinking">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </template>
        </div>
        <div class="input-row">
            <textarea
                class="chat-input"
                placeholder="Ask me to update company, industry, accent color…"
                value={draft}
                onchange={handleDraftChange}
                onkeydown={handleKeyDown}
                disabled={busy}
            ></textarea>
            <button class="send-btn" onclick={handleSend} disabled={sendDisabled}>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
</template>
