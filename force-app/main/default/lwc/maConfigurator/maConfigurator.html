<template>
  <div class={rootClass} style={rootStyle}>
    <template if:true={showLoadError}>
      <div class="load-error" role="status">{_loadError}</div>
    </template>

    <div class="psbar" data-section="header">
      <span class="wm"><span class="tick"></span> Publicis <b>Sapient</b></span>
      <div class="bar-right">
        <a class="backlink" href={industryUrl}>← Industry</a>
        <template if:true={showCustomizeButton}>
          <a class="backlink" href={offeringsUrl}>← Offerings</a>
        </template>
        <c-ma-saved-links-bar lwc:ref="savedLinksBar"></c-ma-saved-links-bar>
        <!-- The gap on .cta already separates these two flex items; the
             &nbsp; that used to be here doubled it. -->
        <button class="cta" onclick={handleOpenBooking}>
          <span class="cta-long">Get an</span>environment assessment →
        </button>
        <template if:true={showCustomizeButton}>
          <!-- Gus is the way in now. "Customize" named a panel; this names
               who you are asking, and it is the same character as the
               assistant in the corner. -->
          <button class="tbtn tbtn-gus" title="Fill in client details with Gus"
                  onclick={handleOpenCustomize}>
            <c-gtm-mascot size="sm"></c-gtm-mascot>
            <span class="tbtn-gus-lbl">Gus</span>
          </button>
        </template>
        <template if:true={showRepLogin}>
          <a class="backlink" href={siteLoginUrl}
             title="You are being served as a guest. Sign in to get the rep view.">Sign in</a>
        </template>
        <button class="tbtn" title="Theme" onclick={handleThemeToggle}>◐</button>
      </div>
    </div>
    <c-ma-stage-actions
      config-id={savedRecordId}
      is-config-manager={isConfigManager}
      onstagesent={handleStageSent}
      onpreviewclient={handleStagePreview}
    ></c-ma-stage-actions>

    <div class="progress" style={progressStyle}></div>

    <template if:true={showCrmStrip}>
      <div class="crm-strip">
        <span class="crm-label">CRM</span>
        <template if:true={hasCrmAccount}>
          <a class="crm-chip crm-chip--account" href={crmAccountUrl} target="_blank" rel="noopener">
            <span class="crm-chip-icon">🏢</span>{crmAccountName}
          </a>
        </template>
        <template if:true={hasCrmOpp}>
          <a class="crm-chip crm-chip--opp" href={crmOppUrl} target="_blank" rel="noopener">
            <span class="crm-chip-icon">💼</span>{crmOppName}
            <template if:true={crmEstimatedValue}>
              <span class="crm-chip-value">{crmEstimatedValue}</span>
            </template>
          </a>
        </template>
        <template if:true={hasCrmContact}>
          <span class="crm-chip crm-chip--contact">
            <span class="crm-chip-icon">👤</span>{crmContactName}
            <template if:true={crmContactEmail}>
              <a class="crm-contact-email" href="mailto:{crmContactEmail}">{crmContactEmail}</a>
            </template>
          </span>
        </template>
      </div>
    </template>

    <!-- 00 COVER -->
    <section class="chap cover" data-section={previewIndustrySection}>
      <div class="wrap">
        <template if:true={hasCompany}>
          <div class="cobrand rv">
            <span class="cb-mono">{companyInitials}</span>
            <span class="cn">{company}</span>
            <span class="cx">with Publicis Sapient</span>
          </div>
        </template>
        <div class="eyebrow rv">Publicis Sapient · {industryTag}</div>
        <h1 class="rv d1">
          <span class={clientTokClass}>{clientDisplay}</span>'s migration should
          have taken months.<br />We did the first pass in&nbsp;<span class="accent">an afternoon.</span>
        </h1>
        <div class="rule rv d2"></div>
        <p class="lede rv d2">
          Your migration, de-risked from day one — moving off&nbsp;<span class={sourceTokClass}>{sourceDisplay}</span> without the months
          of manual discovery, the scope surprises, or the go-live risk. Here's
          how we get you there as your delivery partner, not just a tool, and
          what the first step looks like.
        </p>
        <template if:true={showIndustryDefault}>
          <p class="lede rv d2 ind-slot">
            <lightning-formatted-rich-text value={coverSub}></lightning-formatted-rich-text>
          </p>
        </template>
        <template if:true={hasCustomNote}>
          <p class="lede rv d2 ind-slot custom-note">{customNoteDisplay}</p>
        </template>
        <template if:true={hasCompany}>
          <div class="prepared rv d3">
            Prepared for <b>{company}</b> · Marketing Technology
          </div>
        </template>
      </div>
      <button type="button" class="scrollcue" onclick={handleScrollNext}>
        <span>read on</span><span class="ln"></span>
      </button>
    </section>

    <!-- 01 CONTEXT -->
    <section class="chap">
      <span class="chap-num">01</span>
      <div class="wrap wrap-tight">
        <div class="eyebrow rv">01 — How we work with you</div>
        <h2 class="rv d1">
          A migration partner first.<br />The Accelerator is how we prove it.
        </h2>
        <p class="lede rv d2">
          Publicis Sapient runs your migration end-to-end — strategy, data, and
          engineering under one team, not a tool handed off and left to your
          side of the table. The Migration Accelerator isn't a separate product
          we're selling; it's the same platform our own delivery teams use to
          ground every engagement in evidence, from the first conversation
          through a live cutover.
        </p>
        <div class="cards3 rv d3">
          <div class="pcard">
            <div class="pk">Strategy &amp; business case</div>
            <p>
              Our Virtual Lab reads the business case decks, briefs, and goals
              docs you already have, so strategy starts from your context, not a
              blank page.
            </p>
          </div>
          <div class="pcard">
            <div class="pk">Environment assessment</div>
            <p>
              The Accelerator reads your live platform directly and scores it,
              every asset, every dependency, an audited health check.
            </p>
          </div>
          <div class="pcard">
            <div class="pk">Delivery &amp; build</div>
            <p>
              One team carries it through, and for supported objects, all the
              way to a finished cutover with rollback on standby.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 02 CHALLENGE -->
    <section class="chap band">
      <span class="chap-num">02</span>
      <div class="wrap wrap-tight">
        <div class="eyebrow rv">02 — The challenge</div>
        <h2 class="rv d1">Migrations stall<br />in the dark.</h2>
        <template if:false={hasIndustry}>
          <p class="lede rv d2">
            Years of campaigns, built by people who've since moved on. No map of
            what connects to what. A go-live date that won't move. The hardest
            part of a migration usually isn't the rebuild, it's not knowing what
            you actually have before you start.
          </p>
        </template>
        <template if:true={hasIndustry}>
          <p class="lede rv d2 challenge-extra">
            <lightning-formatted-rich-text value={challengeExtra}></lightning-formatted-rich-text>
          </p>
        </template>
        <div class="chips rv d3">
          <template for:each={chips} for:item="chip">
            <span key={chip} class="chip"><span class="x">—</span> {chip}</span>
          </template>
        </div>
      </div>
    </section>

    <!-- 03 APPROACH -->
    <section class="chap">
      <span class="chap-num">03</span>
      <div class="wrap">
        <div class="eyebrow rv">03 — Our approach</div>
        <h2 class="rv d1">
          We read your environment first.<br />Then we build the plan.
        </h2>
        <p class="lede rv d2">
          The Migration Accelerator ingests your platform and audits it
          automatically, turning it into one clear model and a health score, so
          every decision about what moves, what changes, and what retires is
          grounded in what's genuinely there.
        </p>
        <div class="cards3 rv d3">
          <div class="pcard">
            <div class="pk">Faster</div>
            <p>
              A real, audited read on your whole environment in about an hour,
              not the usual weeks of discovery.
            </p>
          </div>
          <div class="pcard">
            <div class="pk">Evidence-based</div>
            <p>
              Every scope and estimate traces back to your actual data, with a
              full audit trail on every decision.
            </p>
          </div>
          <div class="pcard">
            <div class="pk">Lower risk</div>
            <p>
              We size, sequence, and where it applies, execute from what's
              really there, dry-run first, rollback ready.
            </p>
          </div>
        </div>
        <template if:true={hasIndustry}>
          <div class="indbox rv d3">
            <div class="ib-k">For {industryTag}</div>
            <p class="ib-uc">
              <lightning-formatted-rich-text value={useCase}></lightning-formatted-rich-text>
            </p>
            <p class="ib-sol">
              <lightning-formatted-rich-text value={solution}></lightning-formatted-rich-text>
            </p>
          </div>
        </template>
      </div>
    </section>

    <!-- 04 SEE IT -->
    <section class="chap band">
      <span class="chap-num">04</span>
      <div class="wrap">
        <div class="eyebrow rv">04 — See it</div>
        <h2 class="rv d1">
          Everything you have, mapped,<br />audited, and ready to move.
        </h2>
        <p class="lede rv d2">
          Point the Accelerator at your environment and it does the archaeology
          for you: counts every asset, scores its health, and traces what
          depends on what. Here's a preview of what an assessment surfaces.
        </p>
        <template if:true={hasIndustry}>
          <p class="lede rv d2 proof-line">{proofLine}</p>
        </template>
        <div class="proof-panel rv d3">
          <div class={proofClass}>
            <div class="proof-bar">
              <span class="pd"></span><span class="pd"></span><span class="pd"></span>
              <span class="pt">
                Environment assessment · <b>{clientDisplay}</b>
              </span>
            </div>
            <div class="proof-body">
              <div class="proof-cta">
                <p class="proof-cta-text">
                  A snapshot of what the Accelerator reads from a client's
                  environment, automatically, on day one.
                </p>
                <button class="cta" onclick={handleReveal}>
                  Reveal what the Accelerator sees →
                </button>
              </div>
              <div class="proof-result">
                <div class="metrics">
                  <div class="metric">
                    <div class="mn">{objectsText}</div>
                    <div class="ml">assets mapped</div>
                  </div>
                  <div class="metric">
                    <div class="metric-row">
                      <div class="gauge-ring" style={gaugeStyle}>
                        <span>{gaugeValue}</span>
                      </div>
                      <div class="ml ml-flush">health score</div>
                    </div>
                  </div>
                  <div class="metric">
                    <div class="mn">{depsText}</div>
                    <div class="ml">dependencies traced</div>
                  </div>
                </div>
                <div class="dep">
                  <div class="dep-h">
                    One campaign, and everything it needs to run
                  </div>
                  <div class="dep-flow">
                    <span class="node root">{demoRoot}</span>
                    <span class="arrow">→</span>
                    <template for:each={demoDeps} for:item="dep">
                      <span key={dep} class="node">
                        {dep} <span class="tag">found</span>
                      </span>
                    </template>
                  </div>
                </div>
                <div class="proof-foot">
                  You choose one campaign. The Accelerator brings
                  <span class="accent">&nbsp;everything it depends on&nbsp;</span>
                  with it, so nothing gets left behind at go-live.
                </div>
                <div class="proof-status">
                  <span class="lv"></span> dry run complete · rollback armed
                </div>
              </div>
            </div>
          </div>
          <p class="proof-note rv">
            Preview figures are illustrative until populated with&nbsp;{clientDisplay}'s actual assessment; the behavior shown is real.
          </p>
        </div>
      </div>
    </section>

    <!-- 05 WHAT YOU GET -->
    <section class="chap">
      <span class="chap-num">05</span>
      <div class="wrap">
        <div class="eyebrow rv">05 — What you get</div>
        <h2 class="rv d1">Deliverables you can act on.</h2>
        <div class="deliv rv d2">
          <div class="dcard">
            <span class="dnum">01</span>
            <span class="dt">Environment assessment</span>
            <span class="dd">
              A complete, categorized inventory of your marketing estate,
              surfaced automatically, not hand-built.
            </span>
          </div>
          <div class="dcard new">
            <span class="dnum">02</span>
            <span class="dt">An audited health score</span>
            <span class="dd">
              An evidence-based read of size, complexity, and risk, the numbers
              your estimate and business case can stand on.
            </span>
          </div>
          <div class="dcard">
            <span class="dnum">03</span>
            <span class="dt">Dependency-aware migration plan</span>
            <span class="dd">
              A sequenced plan where shared assets are built once and nothing
              ships broken.
            </span>
          </div>
          <div class="dcard new">
            <span class="dnum">04</span>
            <span class="dt">A live cutover, where it applies</span>
            <span class="dd">
              Dry-run first, then executed, with rollback ready and a
              verification pass once it's done.
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- 06 ENGAGEMENT -->
    <section class="chap band">
      <span class="chap-num">06</span>
      <div class="wrap">
        <div class="eyebrow rv">06 — How we work together</div>
        <h2 class="rv d1">Start small. Prove it. Scale.</h2>
        <p class="lede rv d2">
          You don't have to commit to the whole migration to see the value. It
          begins with a focused environment assessment, low commitment, high
          signal, and grows from there.
        </p>
        <div class="phases rv d3">
          <div class="phase">
            <div class="pdot"></div>
            <div class="php">Start here</div>
            <div class="pht">Assess</div>
            <div class="phb">
              A fixed-scope read of your environment, and a health score you can
              act on.
            </div>
          </div>
          <div class="phase">
            <div class="pdot"></div>
            <div class="php">Design</div>
            <div class="pht">Blueprint</div>
            <div class="phb">
              What moves, what changes, what retires, decided with you, backed
              by data.
            </div>
          </div>
          <div class="phase">
            <div class="pdot"></div>
            <div class="php">Sequence</div>
            <div class="pht">Plan</div>
            <div class="phb">
              A dependency-aware, wave-by-wave plan your teams can execute
              against.
            </div>
          </div>
          <div class="phase">
            <div class="pdot"></div>
            <div class="php">Build</div>
            <div class="pht">Execute</div>
            <div class="phb">
              Build-ready specs, and for supported objects, a live cutover with
              rollback.
            </div>
          </div>
        </div>
        <span class="starthere rv">Your first step is just the assessment.</span>
      </div>
    </section>

    <!-- 07 WHY PS -->
    <section data-section="why" class="chap">
      <span class="chap-num">07</span>
      <div class="wrap">
        <div class="eyebrow rv">07 — Why Publicis Sapient</div>
        <h2 class="rv d1">{whyHead}</h2>
        <template if:true={hasIndustry}>
          <p class="lede rv d1 why-line">{whyLine}</p>
        </template>
        <div class="why rv d2">
          <div class="wcol">
            <div class="wt">Deep platform expertise</div>
            <p>
              Years of hands-on marketing automation delivery across global,
              regulated enterprises.
            </p>
          </div>
          <div class="wcol">
            <div class="wt">A platform, not just hands</div>
            <p>
              Our AI-powered Accelerator does the discovery, audit, and
              increasingly the cutover, work that normally burns months of
              effort.
            </p>
          </div>
          <div class="wcol">
            <div class="wt">End-to-end partnership</div>
            <p>
              Strategy, data, and engineering under one roof, from the first
              assessment through go-live and beyond.
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 08 NEXT STEP -->
    <section class="chap band">
      <span class="chap-num">08</span>
      <div class="wrap wrap-tight">
        <div class="eyebrow rv">08 — The next step</div>
        <h2 class="rv d1">See what's really in<br />your environment.</h2>
        <div class="next-card rv d2">
          <div class="nh">Start with an environment assessment.</div>
          <p>
            Even if you're only exploring, you'll walk away with a genuine,
            audited read on your migration, the size, the risk, the effort,
            whether or not we go further. No months of discovery required.
          </p>
          <div class="next-actions">
            <button class="cta" onclick={handleOpenBooking}>
              Book the assessment →
            </button>
            <a
              href="https://www.publicissapient.com"
              target="_blank"
              rel="noopener"
              class="cta line"
            >
              Explore Publicis Sapient
            </a>
          </div>
          <div class="next-meta">
            <span>
              Your contact ·
              <a href={mailtoHref}>
                <span class={contactNameTokClass}>{contactNameDisplay}</span>
              </a>
              · <span class={contactEmailTokClass}>{contactEmailDisplay}</span>
            </span>
            <span>
              <a
                href="https://www.publicissapient.com"
                target="_blank"
                rel="noopener"
              >
                publicissapient.com
              </a>
            </span>
          </div>
        </div>
      </div>
    </section>

    <footer class="pf" data-section="footer">
      <span class="wm"><span class="tick"></span> {footerLeft}</span>
      <span>{footerRight}</span>
    </footer>

    <c-ma-config-wizard
      is-open={customizeOpen}
      state={tokenState}
      company={company}
      industry={industryKey}
      accent={accent}
      saved-record-id={savedRecordId}
      onclose={handleCloseCustomize}
      onfieldchange={handleFieldChange}
      oncompanychange={handleCompanyChange}
      onindustrychange={handleIndustryChange}
      onaccentchange={handleAccentChange}
      onconfigsaved={handleConfigSaved}
    ></c-ma-config-wizard>

    <!-- The assistant sits in the corner, not inside the Customize form. It
         only appears for the rep, the same rule the Customize button follows:
         a prospect on a shared link has nothing to configure. -->
    <template if:true={showAssistant}>
      <c-ma-agent-bubble
        session-token={agentSessionToken}
        config-id={savedRecordId}
        onagentdelta={handleAgentDelta}
      ></c-ma-agent-bubble>
    </template>

    <c-ma-config-booking
      is-open={bookingOpen}
      booking-url={bookingUrl}
      prospect={company}
      industry-label={industryLabel}
      saved-record-id={savedRecordId}
      submission-token={submissionToken}
      prefill-company={company}
      prefill-platform={sourcePlatformPrefill}
      onclose={handleCloseBooking}
      onsubmitted={handleBookingSubmitted}
    ></c-ma-config-booking>

    <template if:true={showGateLoading}>
      <div class="expired on"></div>
    </template>

    <template if:true={showPasswordGate}>
      <div class="expired on pw-gate">
        <div class="pw-card">
          <div class="xt">This link is password protected.</div>
          <p>Enter the access password provided by your Publicis Sapient contact.</p>
          <form onsubmit={handlePasswordSubmit}>
            <input
              class="pw-input"
              type="password"
              placeholder="Access password"
              value={passwordGateInput}
              onchange={handlePasswordInput}
              autocomplete="current-password"
            />
            <template if:true={passwordGateError}>
              <div class="pw-error" role="alert">{passwordGateError}</div>
            </template>
            <button class="cta pw-btn" type="submit" disabled={passwordGateChecking}>
              {passwordGateSubmitLabel}
            </button>
          </form>
          <a class="pw-rep-link" href={siteLoginUrl}>
            Publicis Sapient? Sign in and skip this &rarr;
          </a>
        </div>
      </div>
    </template>

    <template if:true={expired}>
      <div class="expired on">
        <div>
          <div class="xt">This preview link has expired.</div>
          <p>
            Please reach out to your Publicis Sapient contact for an up-to-date
            version.
          </p>
        </div>
      </div>
    </template>

    <template if:true={inactive}>
      <div class="expired on">
        <div>
          <div class="xt">This preview link is no longer active.</div>
          <p>
            Please reach out to your Publicis Sapient contact for an up-to-date
            version.
          </p>
        </div>
      </div>
    </template>
  </div>
</template>
