<template>
  <div class={rootClass}>
    <div class="bar">
      <div class="bar-wm">
        <span class="tick"></span> Migration Accelerator
        <span class="bar-tag mono">/ the story</span>
      </div>
      <div class="bar-right">
        <button class="tbtn" title="Theme" onclick={handleThemeToggle}>◐</button>
      </div>
    </div>
    <div class="progress" style={progressStyle}></div>

    <template if:true={_editMode}>
      <div class="admin-edit-strip">
        <a href={builderUrl} target="_blank" rel="noopener" class="aes-chip aes-chip--bld">Edit page layout ↗</a>
        <a href={contentManagerUrl} target="_blank" rel="noopener" class="aes-chip aes-chip--cms">Edit content ↗</a>
      </div>
    </template>

    <!-- HERO -->
    <section class="hero wrap">
      <div class="eyebrow rv">
        <span class="bead"></span> {heroEyebrow}
      </div>
      <h1 class="hero-h rv d1">
        <lightning-formatted-rich-text value={heroHeadline}></lightning-formatted-rich-text>
      </h1>
      <p class="hero-sub rv d2">
        <lightning-formatted-rich-text value={heroSubhead}></lightning-formatted-rich-text>
      </p>
      <div class="scroll-cue rv d3">
        <span>scroll</span><span class="ln"></span>
      </div>
    </section>

    <!-- PROBLEM BEAT -->
    <section class="beat wrap">
      <p class="lede rv">
        <lightning-formatted-rich-text value={problemLede}></lightning-formatted-rich-text>
      </p>
      <div class="chip-row rv d1">
        <template for:each={problemChips} for:item="chip">
          <span key={chip} class="chip"><b>—</b>{chip}</span>
        </template>
      </div>
      <p class="close-line rv d2">
        <lightning-formatted-rich-text value={problemClose}></lightning-formatted-rich-text>
      </p>
    </section>

    <!-- MECHANISM -->
    <section class="beat wrap wide">
      <div class="eyebrow rv"><span class="bead"></span> The mechanism</div>
      <h2 class="beat-h rv d1">
        <lightning-formatted-rich-text value={mechanismHead}></lightning-formatted-rich-text>
      </h2>
      <p class="lede rv d1">
        <lightning-formatted-rich-text value={mechanismSub}></lightning-formatted-rich-text>
      </p>

      <div class="route rv d2">
        <template for:each={routeSteps} for:item="step">
          <div key={step.stepLabel} class="route-node">
            <div class="route-line"></div>
            <div class="rdot"></div>
            <div class="rt">{step.stepLabel}</div>
            <div class="rd">{step.stepDesc}</div>
          </div>
        </template>
      </div>

      <div class={proofClass}>
        <div class="proof-bar">
          <span class="pd"></span><span class="pd"></span><span class="pd"></span>
          <span class="pt">migration-accelerator · live preview</span>
        </div>
        <div class="proof-body">
          <div class="proof-cta">
            <p>
              <lightning-formatted-rich-text value={proofCtaText}></lightning-formatted-rich-text>
            </p>
            <button class="btn" onclick={handleReveal}>See it work →</button>
          </div>
          <div class="proof-result">
            <div class="proof-grid">
              <div class="p-stat">
                <div class="ps-n">{objectsText}</div>
                <div class="ps-l">objects mapped</div>
              </div>
              <div class="p-stat row">
                <div class="gauge-mini" style={gaugeStyle}>
                  <span>{gaugeValue}</span>
                </div>
                <div>
                  <div class="ps-l flush">health score</div>
                </div>
              </div>
              <div class="p-stat">
                <div class="ps-n">{depsText}</div>
                <div class="ps-l">dependencies traced</div>
              </div>
            </div>
            <div class="p-dep">
              <span class="p-node root">{proofDemoRoot}</span>
              <template for:each={proofDemoDeps} for:item="dep">
                <span key={dep} class="p-node">{dep}</span>
              </template>
            </div>
            <div class="p-status-wrap">
              <span class="p-status">
                <span class="lv"></span> dry run complete · rollback armed
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- CAPABILITIES -->
    <section class="beat wrap">
      <div class="eyebrow rv"><span class="bead"></span> The capabilities</div>
      <h2 class="beat-h rv d1">What's actually built.</h2>
      <div class="cap-grid rv d2">
        <template for:each={capabilities} for:item="cap">
          <div key={cap.cardTitle} class={cap.cardClass}>
            <div class="cc-ic">{cap.icon}</div>
            <div class="cc-t">{cap.cardTitle}</div>
            <div class="cc-d">{cap.cardDesc}</div>
          </div>
        </template>
      </div>
      <div class="bonus-card rv d3">
        <lightning-formatted-rich-text value={bonusCard}></lightning-formatted-rich-text>
      </div>
    </section>

    <!-- CLIENT PROFILE -->
    <section class="beat wrap">
      <div class="eyebrow rv"><span class="bead"></span> The client profile</div>
      <h2 class="beat-h rv d1">Who this fits.</h2>
      <div class="stat-block rv d2">
        <span class="stat-big">{clientStatBig}</span>
        <span class="stat-desc">
          <lightning-formatted-rich-text value={clientStatDesc}></lightning-formatted-rich-text>
        </span>
      </div>
      <p class="note-line rv d3">
        <lightning-formatted-rich-text value={clientNote}></lightning-formatted-rich-text>
      </p>
    </section>

    <!-- BD / HOW TO RUN IT -->
    <section class="beat wrap wide">
      <div class="eyebrow rv">
        <span class="bead"></span> For Business Development and Industry Leaders
      </div>
      <h2 class="beat-h rv d1">{bdHead}</h2>
      <p class="lede rv d1">
        <lightning-formatted-rich-text value={bdLede}></lightning-formatted-rich-text>
      </p>

      <div class="use-grid rv d2">
        <template for:each={bdUseCases} for:item="uc">
          <div key={uc.caseTitle} class="use-card">
            <div class="uc-t">{uc.caseTitle}</div>
            <div class="uc-d">{uc.caseDesc}</div>
          </div>
        </template>
      </div>

      <div class="pitch-shift rv d3">
        <div class="ps-col old">
          <span class="ps-label">The old pitch</span>
          <template for:each={pitchOldChips} for:item="chip">
            <span key={chip} class="ps-chip">{chip}</span>
          </template>
        </div>
        <div class="ps-arrow">→</div>
        <div class="ps-col new">
          <span class="ps-label">This pitch</span>
          <template for:each={pitchNewChips} for:item="chip">
            <span key={chip} class="ps-chip">{chip}</span>
          </template>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="beat wrap">
      <div class="eyebrow rv"><span class="bead"></span> FAQ</div>
      <h2 class="beat-h rv d1">The questions this needs to survive.</h2>
      <div class="faq rv d2">
        <template for:each={faqs} for:item="faq">
          <div key={faq.id} class={faq.itemClass}>
            <button class="faq-q" data-id={faq.id} onclick={handleFaqToggle}>
              {faq.question}
              <span>
                <span class={faq.verdictClass}>{faq.verdict}</span>
                <span class="fq-plus">+</span>
              </span>
            </button>
            <template if:true={_editMode}>
              <a href={faq.cmsUrl} target="_blank" rel="noopener" class="faq-edit-link" title="Edit this FAQ in CMS">✎</a>
            </template>
            <div class="faq-a">
              <div class="faq-a-in">
                <lightning-formatted-rich-text value={faq.answer}></lightning-formatted-rich-text>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- CLOSING -->
    <section class="closing wrap">
      <h2 class="rv">
        <lightning-formatted-rich-text value={closingHead}></lightning-formatted-rich-text>
      </h2>
      <p class="rv d1">
        <lightning-formatted-rich-text value={closingSub}></lightning-formatted-rich-text>
      </p>
      <p class="rv d1 cta-line">
        <a class="btn" href={acceleratorUrl} target="_blank" rel="noopener">
          Build a client-specific version →
        </a>
      </p>
    </section>

    <footer class="pf">
      <span>Migration Accelerator — positioning working draft</span>
      <span>Grounded against ma-migrator + project-conduit, August 2026</span>
    </footer>
  </div>
</template>
