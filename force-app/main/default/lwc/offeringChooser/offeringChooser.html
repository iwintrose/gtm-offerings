<template>
  <div class={rootClass}>
    <div class="bar">
      <div class="bar-wm">
        <span class="tick"></span> Publicis Sapient
        <span class="bar-tag mono">/ GTM Offerings</span>
      </div>
      <div class="bar-right">
        <c-ma-saved-links-bar></c-ma-saved-links-bar>
        <button class="tbtn" title="Theme" onclick={handleThemeToggle}>◐</button>
      </div>
    </div>

    <div class="wrap">
      <div class="eyebrow"><span class="bead"></span> Step 1 of 2</div>
      <h1>Choose your offering.</h1>
      <p class="sub">
        Pick the practice offering you're presenting. Next, you'll tell us who
        it's for, and the story reframes around them.
      </p>

      <div class="grid">
        <a class="tile live" href={industryUrl}>
          <div class="tile-accent-bar"></div>
          <div class="tile-mark">MA</div>
          <div class="tile-name">Migration Accelerator</div>
          <div class="tile-desc">
            <lightning-formatted-rich-text value={tileDescription}></lightning-formatted-rich-text>
          </div>
          <div class="tile-go">Explore this offering →</div>
        </a>

        <div class="tile soon">
          <div class="tile-mark">?</div>
          <div class="tile-name">Next offering</div>
          <div class="tile-desc">
            Space reserved for the next practice offering added to this
            framework.
          </div>
          <span class="soon-tag">Coming soon</span>
        </div>

        <div class="tile soon">
          <div class="tile-mark">?</div>
          <div class="tile-name">Next offering</div>
          <div class="tile-desc">
            Space reserved for the next practice offering added to this
            framework.
          </div>
          <span class="soon-tag">Coming soon</span>
        </div>
      </div>
    </div>

    <footer class="pf">
      <span>gtm-offerings — shared front door</span>
      <span>Publicis Sapient · internal</span>
    </footer>
  </div>
</template>
