# HUBSPOT -> MARKETING CLOUD NEXT.
#
# The worked sample: every layer this design supports is exercised here, so
# there is one file a consultant can read end to end before authoring their
# own pair. Layer 1 on estate_scale and integration_containment, layer 2 on
# source_access, orchestration_portability, content_portability and
# consent_portability, layer 3 on slot 5, and layer 4 through two supplement
# sets. What it does NOT do is move a band edge or reweight a slot -- the total
# is still out of 32 and 27 is still Fast-Track, because a HubSpot prospect and
# an Eloqua prospect have to be comparable or the score is decoration.
#
# POSTURE: interview_only at both ends. No adapter reads HubSpot and none
# writes MCN. Every estate figure on this readout is what the client told us,
# and the readout says so above the fold. That sentence is the price of asking
# the questions at all.
#
# TWO CEILINGS, BOTH VISIBLE. source_access maxes at 3 and consent_portability
# maxes at 3. The excluded option still renders, greyed, with the reason next
# to it. A prospect who can see that a 4 was not on offer and why can argue
# with the instrument; a prospect who cannot has been quietly marked down.

name: hubspot_to_mcn
source: hubspot
target: sfmc_next
specificity: 1
active: true
version: "2026.09.1"

capability_posture: interview_only
source_posture: interview_only
target_posture: interview_only
posture_statement: >-
  Before you start, one thing about how we will read your answers. Nothing is
  instrumented on either end of this move: no connector reads HubSpot and no
  adapter writes Marketing Cloud Next. Everything you tell us is your
  description of the estate, structured against what we know about the target.
  We treat every count as illustrative until a working session confirms it — the
  structural gaps we name in your readout are the part that does not depend on
  the counts being right.

emphasis_slots: [orchestration_portability, content_portability, crm_and_data_model_entanglement]
supplement_sets: [mcn_readiness, hubspot_context]

overrides:
  # ---- Slot 1. Layer 1: same anchors, HubSpot's nouns. ----
  - dimension: estate_scale
    layer: reword
    label: Estate Scale
    question: >-
      Roughly how much is live in HubSpot today — active workflows, lists,
      published emails and landing pages?
    evidence_prompt: "Ask for four numbers, not an adjective: active workflows, lists, emails published in the last 12 months, live landing pages."
    respondent_hint: >-
      Useful to have to hand: your counts of active workflows, lists, marketing
      emails published in the last 12 months and live landing pages.
    rationale: skills/mce-mcn-helper/references/skills/02-maturity.md — the org-signal method (count the artefacts, do not accept the adjective) applied to HubSpot's object names. Anchors are unchanged from base, which is what makes this layer 1 rather than layer 2.

  # ---- Slot 2. Layer 2 + a visible ceiling. ----
  - dimension: source_access
    layer: recalibrate
    question: >-
      If we started next week, how would an extract of your HubSpot estate
      actually be produced — and who would do it?
    options:
      - value: 1
        label: "No admin access, no owner, and nobody has exported anything from HubSpot before."
      - value: 2
        label: "A super admin exists; private-app tokens have not been created and would need someone's approval."
      - value: 3
        label: "A super admin can create a private app with the needed scopes this week, and someone on the team can run an operator-led extract."
      - value: 4
        label: "A supported connector reads the source directly with no operator in the loop."
    max_attainable: 3
    ceiling_reason: "No HubSpot connector ships today. The best available path is an operator-run extract against a private app, which is what a 3 describes — so a 4 is not on offer for this pair, for anyone."
    evidence_prompt: "Ask who holds Super Admin, and whether private apps are permitted by their security team at all."
    respondent_hint: >-
      Worth checking before you answer: who holds HubSpot Super Admin, and
      whether your security team allows private apps at all.
    rationale: >-
      docs/specs/tier-2/sfmc-next-target-adapter.md — the adapter matrix this accelerator ships covers Eloqua and SFMC as sources; there is no HubSpot source adapter, so the top anchor describes a capability that does not exist for this pair. Capping rather than silently rewording the 4 is what keeps this comparable to a pair where a 4 IS reachable: the same scale, with a stated ceiling, rather than a different scale wearing the same numbers.

  # ---- Slot 3. Layer 2: anchored on the three things Flow has no answer for. ----
  - dimension: orchestration_portability
    layer: recalibrate
    question: >-
      How much of your workflow logic depends on re-enrolment, goal criteria,
      or loops — as opposed to a straight sequence of branches and delays?
    options:
      - value: 1
        label: "Re-enrolment is on across most workflows, goals drive exits, and at least one workflow loops. The logic IS the re-entry behaviour."
      - value: 2
        label: "Several workflows re-enrol or use goal criteria; removing them would change what the programme does."
      - value: 3
        label: "Mostly linear branch-and-delay logic; re-enrolment is on in a handful of places and is not load-bearing."
      - value: 4
        label: "Linear, single-entry flows throughout. No goals, no loops, no re-enrolment anywhere."
    evidence_prompt: "Ask them to open one workflow and read out its enrolment settings — 're-enrol contacts' and 'goal' are checkboxes, so this is a factual answer, not an impression."
    respondent_hint: >-
      If you are not sure, open one of your busier workflows: 're-enrol contacts'
      and 'goal' are checkboxes in its settings.
    rationale: >-
      skills/mce-mcn-helper/references/framework-reference.md — "Journey Builder -> Campaign Flow ... No 'No Re-entry' equivalent yet - workaround is a DMO tracking flow entry used as segment exclusion", i.e. even the RE-ENTRY SUPPRESSION side has no native element; docs/specs/tier-2/sfmc-next-target-adapter.md — capabilities.flow_control.loops status unsupported ("Flow does not support loopbacks"). Goal criteria have no counterpart in either document, which is the point: three of HubSpot's four most-used workflow features are things the target expresses as something else or not at all. Recalibrated, not reworded: a 4 here requires their absence.

  # ---- Slot 4. Layer 2: custom modules and HubL, IN MARKETING EMAIL.  ----
  # ---- Rescoped alongside hubspot__sfmc's slot 4 and for the identical ----
  # ---- reason: HubSpot CMS is a different migration. Anchors stay one  ----
  # ---- band harsher than the classic pack's -- MCN has no scripting.   ----
  - dimension: content_portability
    layer: recalibrate
    label: Email Content Portability
    question: >-
      Thinking about the MARKETING EMAILS that would be rebuilt as target-side
      templates and content assets — how many templates are in real use, how
      much of each is custom modules and HubL logic rather than standard
      modules and copy, and how many language variants are maintained?
    options:
      - value: 1
        label: "A large template and module library that emails are assembled from, with HubL macros, includes and loops doing real logic inside the email, and every template maintained in several language variants."
      - value: 2
        label: "A meaningful set of custom modules and HubL snippets in the emails — conditionals, includes, personalisation well beyond tokens."
      - value: 3
        label: "Mostly drag-and-drop from standard modules; HubL confined to simple personalisation tokens."
      - value: 4
        label: "Templates and copy only, few enough to rebuild deliberately, with personalisation that is merge fields and nothing more."
    evidence_prompt: "Ask for email templates used in the last 12 months, modules ranked by usage IN EMAILS, and how many templates exist in more than one language. Landing pages, site pages, blog and HubDB are not counted here — whether they are even moving is the cms_scope_expectation probe."
    respondent_hint: >-
      Useful to have to hand: how many email templates you have used in the last
      12 months, which custom modules appear in those emails, and how many of the
      templates exist in more than one language.
    rationale: >-
      skills/mce-mcn-helper/references/framework-reference.md — "Content Builder ->
      Marketing Workspace (Rebuilt). No automated migration. Templates must be rebuilt
      manually", and "Cloud Pages -> Experience Cloud pages / LWC (Bridge or rebuild).
      No direct equivalent"; docs/specs/tier-2/sfmc-next-target-adapter.md —
      personalization.ampscript unsupported, dynamic_content_blocks partial, i.e. the
      target's personalisation primitives are merge fields, Calculated Insights and
      Einstein slots. HubL and custom modules are source-side platform knowledge held
      by the authoring consultant, which is precisely what interview_only posture
      declares. THE BANDING IS DELIBERATELY ONE HARSHER THAN
      migration-accelerator/instrument/migration-accelerator/pairs/hubspot_to_sfmc.yaml's slot 4, and stays so
      after the rescope: migration-accelerator/capabilities/platforms/hubspot.yaml,
      hubl_templating severity_by_target — "SFMC Next: there is no scripting language
      at all, so expressive HubL escalates toward blocker" — which is why custom modules
      plus expressive HubL sit at 2 here and at 3 there. THE RESCOPE, applied here for
      the same reason it was applied there: HubL and custom modules span two migrations.
      Marketing emails are rebuilt on the target by this engagement and are correctly
      scored; landing pages, site pages, blog and HubDB-driven pages are HubSpot CMS,
      which a marketing-automation migration does not move — so scoring readiness on
      them marked a client down for content nobody was proposing to touch. HubDB has
      left these anchors and is asked instead, unscored, as cms_scope_expectation in
      migration-accelerator/instrument/migration-accelerator/supplements/hubspot_context.yaml, which this pack
      already fires; the hubdb_dependency callout below is reframed to read as
      conditional on that answer rather than as an assumed blocker.

  # ---- Slot 5. Layer 3: SUBSTITUTION. Same position, same risk theme, ----
  # ---- different question, because the difference is one of kind.      ----
  - dimension: data_model_readiness
    layer: substitute
    new_key: crm_and_data_model_entanglement
    label: CRM & Data Model Entanglement
    question: >-
      In HubSpot, the CRM and the marketing platform are the same product. How
      much of your customer data model would have to move with the marketing
      estate — and who else is using it?
    options:
      - value: 1
        label: "HubSpot IS the CRM. Sales works in it daily, deals and pipeline live there, and marketing data cannot be separated from it."
      - value: 2
        label: "HubSpot CRM is in real use by at least one non-marketing team, and custom objects or properties are shared across them."
      - value: 3
        label: "HubSpot CRM holds marketing contacts and properties only; the system of record for customers is elsewhere and syncs in."
      - value: 4
        label: "A separate system of record already owns the customer; HubSpot holds marketing attributes that could be re-derived from it."
    evidence_prompt: "Ask who logs into HubSpot who is not in marketing, and what they do there."
    respondent_hint: >-
      Worth knowing before you answer: who logs into HubSpot who is not in
      marketing, and what they do there.
    rationale: >-
      skills/mce-mcn-helper/references/skills/02-maturity.md — diagnostic question 6, "Who owns your customer data model?", where the Stage 2 answer is "Marketing owns DEs, CRM team owns CRM, they sync periodically". That question assumes the two are separable; in HubSpot they are one product, so the base slot's question ("is the data model knowable and mappable") is not a harder or easier version of the right question, it is a different question. SUBSTITUTION RATIONALE (required for layer 3): the slot keeps position 5 and keeps its risk theme — whether the audience/data layer can be moved — but the thing that makes it risky here is entanglement with another team's system of record rather than the shape of the schema. Rewording the base anchors would have produced a question whose 1 and its 4 described different axes. Slot count, position and 1-4 scale are unchanged, so the total is still out of 32 and still comparable.

  # ---- Slot 6. Layer 1. ----
  - dimension: integration_containment
    layer: recalibrate
    question: >-
      Of the things wired into HubSpot — native app-marketplace integrations,
      forms embedded on sites you do not control, webhooks, a two-way CRM sync —
      how many are owned by a team outside marketing, and how many would have to
      be re-pointed by someone else before you could switch off HubSpot?
    options:
      - value: 1
        label: "Several are owned outside marketing, including forms embedded on sites another team controls, and nobody has a full list of who owns what."
      - value: 2
        label: "The main ones are known and at least one sits with another team, so cutover depends on a schedule marketing does not set."
      - value: 3
        label: "A small number of integrations, all with a named owner inside or beside marketing, and any embedded forms are on pages we control."
      - value: 4
        label: "Nothing outside marketing depends on HubSpot. Forms are on our own pages and the integrations we have could be re-pointed by this team alone."
    evidence_prompt: "Ask for the installed-apps list and the count of forms embedded outside their own domain."
    respondent_hint: >-
      Worth knowing before you answer: which teams own the integrations connected
      to HubSpot, and whether any of your forms are embedded on pages another
      team looks after.
    rationale: >-
      skills/mce-mcn-helper/references/skills/10-roadmap.md — the external-dependency and risk-register framing, where integrations owned outside marketing are the items that set the roadmap's outer bound, which is the anchor this scale is now built on. RECALIBRATED FROM LAYER 1, for the same reason and by the same edit as migration-accelerator/instrument/migration-accelerator/pairs/hubspot_to_sfmc.yaml: the base anchors counted integrations, and this pack now also asks for that count on the complexity axis (integration_surface, below), so a respondent met the same question twice. Complexity asks HOW MANY are wired in; readiness asks WHO OWNS THEM and whether cutover waits on somebody else. Only the scale moved — the named examples are unchanged.

  # ---- Slot 7. Layer 2 + a visible ceiling. ----
  - dimension: consent_portability
    layer: recalibrate
    question: >-
      Where does subscription and consent state live — HubSpot subscription
      types, GDPR fields, or somewhere outside the platform entirely?
    options:
      - value: 1
        label: "Consent is HubSpot subscription types plus list membership, with no record of when or how it was given."
      - value: 2
        label: "Subscription types are used properly and lawful basis is recorded, but only inside HubSpot."
      - value: 3
        label: "Consent state is held or mirrored outside HubSpot, with provenance, and could be re-established on a new platform."
      - value: 4
        label: "Consent is already a cross-channel policy on the target platform, verified against current behaviour."
    max_attainable: 3
    ceiling_reason: "MCN Consent & Custom Preferences is a Spring '26+ capability and its parity with a live preference centre is unverified. Nobody can score a 4 on this pair today, because the thing a 4 describes cannot yet be confirmed to exist — which is also why the consent workstream comes off the critical path rather than onto it."
    rationale: >-
      skills/mce-mcn-helper/references/framework-reference.md — "Custom Preference Center -> MCN Consent & Custom Preferences (Spring '26+) (Rebuilt). Verify current feature parity before committing to rebuild timeline"; skills/mce-mcn-helper/references/skills/10-roadmap.md — "Preference center: bridge on MCE -> rebuild after Spring '26 parity verification. Do not put on critical path until parity confirmed", and "Custom consent model required: add 2-4 weeks". The ceiling and the consent_parity_risk gate say the same thing to two different audiences: the ceiling to the person answering, the gate to the person reading the readout.

  # ---- Slot 8. Not overridden, ever. decision_readiness is layer 0 for ----
  # ---- every pair: it is the slot that decides whether anything is     ----
  # ---- bought, and it must mean the same thing everywhere.             ----

# ===========================================================================
# ESTATE COMPLEXITY — the second axis, in HubSpot's nouns.
#
# The source half of this block is identical in substance to the one in
# migration-accelerator/instrument/migration-accelerator/pairs/hubspot_to_sfmc.yaml, and deliberately so:
# complexity measures the SOURCE estate, and the source is the same HubSpot
# estate whichever Salesforce platform it is heading for. Sizing it differently
# per target would mean a client's complexity band moved when they changed their
# mind about the destination, which is precisely the thing the fixed frame
# exists to make impossible.
#
# WHAT DOES DIFFER is the second half of the data-model and permission
# dimensions, where the base wording being replaced was Data Cloud's rather than
# Data Extensions', and where MCN's consent model is a Spring '26+ capability
# rather than a live one. Neither changes what is COUNTED; both are noted in the
# rationales so a reader can see the divergence was considered and rejected.
#
# Every option is a count or a volume — see the rule in
# migration-accelerator/instrument/migration-accelerator/complexity.yaml.

complexity_overrides:
  - dimension: journey_footprint
    layer: recalibrate
    label: Workflow Footprint
    question: >-
      Roughly how many workflows are switched on in HubSpot right now, and how
      many of those start from something happening rather than from a schedule?
    measures: How many automated programmes are live, and how they start
    options:
      - value: 1
        label: "Fewer than 20 active workflows, mostly list-based or scheduled enrolment."
      - value: 2
        label: "Between 20 and 80 active workflows, a mix of list-based enrolment and event or form triggers."
      - value: 3
        label: "More than 80 active workflows, with enrolment driven mostly by events, webhooks or API calls."
    respondent_hint: >-
      Your workflows list shows the active count directly, and each workflow's
      enrolment trigger is on its first step.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — automation.workflows and entry_sources' webhook_or_api_enrolment. Identical to the hubspot__sfmc wording on purpose: the estate being counted is the same estate, and a complexity band that moved when the destination changed would be measuring the target rather than the client. skills/mce-mcn-helper/references/skills/03-org-scoring.md — the count-the-artefacts method. Counts and trigger mix only; how much of the workflow logic survives is slot 3.

  - dimension: data_extension_complexity
    layer: recalibrate
    label: Data Model Size
    question: >-
      How much customer data sits behind your sends — roughly how many contact
      properties are in use, and do you have custom objects as well as contacts
      and companies?
    measures: How much audience data there is, and how many pieces it is in
    options:
      - value: 1
        label: "Contacts and companies with mostly HubSpot-standard properties; a few dozen custom properties at most, and no custom objects."
      - value: 2
        label: "A few hundred custom properties in use, deals or tickets read by marketing, and perhaps one or two custom objects."
      - value: 3
        label: "Custom properties in the high hundreds or more, several custom objects with their own associations, and calculated or rollup properties feeding segmentation."
    respondent_hint: >-
      Settings then Properties gives you the count per object, and Data Model
      lists any custom objects.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — object_catalog.crm_data_model: contact_properties with its calculation and rollup subtypes, companies, deals, tickets, custom_objects and associations. The base wording asked about "30-100 tables, moderate SQL", which is Marketing Cloud's Data Extension vocabulary and doubly wrong here, since this target's person model is Data Cloud's Unified Individual rather than a table count at all. What is COUNTED is the same as on hubspot__sfmc and unchanged by that: the client has the properties and objects they have. Whether the model must be resolved into a unified profile before anything can be configured is slot 5's substituted question on this pair, and is not asked again here.

  - dimension: scripting_depth
    layer: recalibrate
    label: Custom Code Footprint
    question: >-
      How much hand-written code is there inside your HubSpot estate — HubL in
      templates and custom modules, and custom code or webhook actions inside
      workflows?
    measures: How much hand-written code is embedded in the estate
    options:
      - value: 1
        label: "Drag-and-drop and rich-text throughout. No custom modules of our own, and no custom code actions in workflows."
      - value: 2
        label: "A handful of custom modules, some HubL in templates, and up to about five custom code or webhook actions across all workflows."
      - value: 3
        label: "A custom module library that most content is built from, HubL doing real work in templates, and custom code or webhook actions in regular use."
    respondent_hint: >-
      Design Manager lists your custom modules, and custom code and webhook
      actions appear as steps inside workflows.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — content.hubl, content.custom_modules, and gap pattern operations_hub_custom_code; infrastructure names custom_code_and_webhook_actions as "Operations Hub Professional+", so an account without that tier answers 1 truthfully. The base wording asked about "server-side code" and "hosted pages", which are Marketing Cloud's SSJS and CloudPages — and on THIS target neither exists at all, so the base scale was not merely foreign, it named two things the destination cannot offer. Counts artefacts only; that this target has no scripting language, and what that costs, is slot 4's recalibration.

  - dimension: business_unit_structure
    layer: reword
    label: Account Structure
    question: >-
      How many HubSpot portals do you run, and are they split into business
      units inside one account?
    measures: How many separate tenancies or brand containers there are
    options:
      - value: 1
        label: "One portal, with no business units."
      - value: 2
        label: "Two to five portals or business units, sharing some content and property definitions."
      - value: 3
        label: "Six or more portals or business units, or brands that share content and audiences across several of them."
    respondent_hint: >-
      Business units are an Enterprise feature, so if you have never seen the
      setting, the answer is almost certainly one portal.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — the tenancy nouns the object catalogue and infrastructure.tier_gating use (portals, and Enterprise-only business units), replacing the base wording's "child accounts", which is not a HubSpot construct. LAYER 1: the bands are untouched because the thing counted is the same thing. The one complexity dimension with no readiness slot beside it, so there was nothing to disentangle.

  - dimension: integration_surface
    layer: recalibrate
    label: Connected Systems
    question: >-
      How many other systems are connected to HubSpot — marketplace apps,
      connected ad accounts, and anything built against the API?
    measures: How many other systems are wired in
    options:
      - value: 1
        label: "A CRM or ad-account connection or two from the marketplace, and nothing custom."
      - value: 2
        label: "Several marketplace apps plus one or two things built against the HubSpot API, and some connected ad accounts."
      - value: 3
        label: "Many connected apps and ad accounts, plus custom integrations built against the API, and forms embedded on sites beyond our own."
    respondent_hint: >-
      Your installed-apps list and connected ad accounts are both under Settings
      then Integrations.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — extraction.authentication's private-app model, gap patterns ads_audience_sync and forms_and_ctas_rebuild, and object_catalog.audiences.ads_audiences, whose gloss is why connected ad accounts are counted separately: "The sync connection itself is a live integration, not an asset." The base wording's "Custom REST/SOAP integrations" describes a Marketing Cloud estate. COUNT ONLY: slot 6 on this pair was moved off counting and onto ownership in the same edit, so the two stop asking the same thing.

  - dimension: consent_suppression_model
    layer: recalibrate
    label: Permission Model Size
    question: >-
      How many subscription types are in use, and how many places hold opt-out
      or suppression state — HubSpot alone, or other systems as well?
    measures: How many permission categories exist, and how many places they live
    options:
      - value: 1
        label: "A handful of subscription types, and HubSpot's own opt-out and suppression state is the only record."
      - value: 2
        label: "Ten or more subscription types, or a preference page we have customised, or one other system that also holds opt-outs."
      - value: 3
        label: "Dozens of subscription types, per-language or per-brand preference pages, and opt-out state held in more than one other system as well."
    respondent_hint: >-
      Your subscription types are listed under Marketing then Email then
      Subscription Types, with a count at the top.
    rationale: >-
      migration-accelerator/capabilities/platforms/hubspot.yaml — consent.model, object_catalog.consent_and_identity.subscription_types and preference_pages. The base wording's bottom option, "standard publication or subscription lists", is a Marketing Cloud construct and on THIS target it is not even the target's own construct: MCN's consent model is a Spring '26+ capability whose parity is unverified, which is why slot 7 here carries a ceiling. That ceiling belongs on the readiness axis and is not repeated here — how many permission categories the client has is a fact about the client, and it does not become a smaller number because the destination is unfinished. COUNTS AND PLACES ONLY.

callouts:
  - pattern: hubdb_dependency
    status: unsupported
    severity: blocker
    category: content
    issue: "CONDITIONAL ON SCOPE — where HubDB-backed content is expected to move, those pages or emails are backed by tables with no target equivalent"
    gloss: "HubDB has no equivalent anywhere in the Salesforce marketing stack. Most of what it backs is HubSpot CMS, and whether any of that is in this migration is the cms_scope_expectation probe rather than an assumption this callout makes: if HubSpot CMS is being kept, this is a boundary to record; if it is expected to move, or if an EMAIL renders from a HubDB query, it is a blocker."
    workaround: >-
      Read the cms_scope_expectation answer before pricing any of this. If
      HubSpot CMS is being kept, record the boundary, confirm no marketing email
      queries HubDB, and stop. If the content is expected to move: there is no
      like-for-like target. Each HubDB-backed page becomes either a Salesforce
      custom object rendered through an Experience Cloud page or LWC, or a
      static rebuild if the table is small and slow-moving. This is an
      application-development scope item, not a content-migration one, and it
      should be priced as such.
    manual_steps:
      - "Read the cms_scope_expectation answer first: is HubSpot CMS kept, moved, or moved as a separate programme?"
      - "Confirm separately whether any marketing email renders from a HubDB query — that half is in scope whatever happens to the website"
      - "If the content stays on HubSpot CMS, write the boundary into the scope document and stop"
      - "Inventory HubDB tables and the pages that read them"
      - "Classify each as data-backed application vs static content"
      - "For each application: model the object and choose Experience Cloud or LWC"
      - "Price separately from the marketing migration and name the owner"
    verification_required: false
    rationale: >-
      skills/mce-mcn-helper/references/framework-reference.md — "Cloud Pages ->
      Experience Cloud pages / LWC (Bridge or rebuild). No direct equivalent.
      Customer-facing pages -> Experience Cloud. Internal tooling -> LWC." HubDB is a
      structured-data-backed page builder with no counterpart in Content Studio,
      Marketing Workspace or Experience Cloud out of the box, so it lands in the same
      rebuild bucket as Cloud Pages but with a schema attached.
      docs/specs/tier-2/sfmc-next-target-adapter.md confirms the target has no Data
      Extension concept either, so there is no marketing-side table to land it in.
      REFRAMED AS CONDITIONAL when slot 4 above was rescoped to marketing email: HubDB
      mostly backs HubSpot CMS, and this engagement does not move HubSpot CMS. The
      callout is kept rather than dropped because it is a real gap the moment the
      client expects that content to travel, and that expectation is now asked directly
      as cms_scope_expectation in
      migration-accelerator/instrument/migration-accelerator/supplements/hubspot_context.yaml, which this
      pack fires.

  - pattern: workflow_reenrolment
    status: unsupported
    severity: blocker
    category: flow_control
    issue: "Workflows depend on re-enrolment or goal criteria"
    gloss: "Flow has no re-enrolment element and no goal element; Campaign Flow has no 'No Re-entry' equivalent either"
    workaround: >-
      Model entry as a segment and track prior entry in a DMO used as a segment
      exclusion, then express the goal as an exit condition evaluated by a
      Decision element. Re-enrolment on a changed property becomes a segment
      that re-qualifies — which behaves differently at the edges, and those
      edges need naming before build.
    manual_steps:
      - "List every workflow with re-enrolment enabled and record the trigger property"
      - "List every workflow with goal criteria and record the goal"
      - "For each, decide whether the behaviour is required or historical"
      - "Model the required ones as segment + DMO exclusion and confirm edge behaviour with the client"
    verification_required: false
    rationale: skills/mce-mcn-helper/references/framework-reference.md — "No 'No Re-entry' equivalent yet - workaround is a DMO tracking flow entry used as segment exclusion", and the workflow motion mapping row that replaces journey entry with a live Data 360 segment; docs/specs/tier-2/sfmc-next-target-adapter.md — capabilities.flow_control.loops unsupported. Blocker rather than major because in a HubSpot estate re-enrolment is frequently the mechanism the programme is built on, not a setting on it.

  - pattern: sequences_out_of_scope
    status: unsupported
    severity: major
    category: scope
    issue: "HubSpot Sequences are in use and were not scoped"
    gloss: "Sequences are Sales Engagement — a different product surface, a different budget, and usually a different team"
    workaround: >-
      Decide explicitly whether Sequences are in or out. If in, they map to
      Sales Engagement / Salesforce cadences and belong to the Sales programme,
      not this one. If out, name who keeps running them and on what, because
      they do not survive HubSpot being switched off.
    manual_steps:
      - "Ask Sales directly whether Sequences are in use and how many"
      - "Get a named owner and a named budget, or a written out-of-scope decision"
      - "If in scope, route to the Sales Cloud workstream rather than absorbing it here"
    verification_required: false
    rationale: docs/specs/tier-2/sfmc-next-target-adapter.md — the adapter's scope is marketing orchestration (Flow, Content Studio, segments); sales-engagement cadences are outside both its source and target surface. skills/mce-mcn-helper/references/skills/10-roadmap.md — the external-dependency section, where an unowned adjacent workstream is the standard cause of a slipped phase. Raised as a callout rather than a question because the answer is routinely "nobody asked Sales", and a callout survives that answer where a scored question does not.

rationale: skills/mce-mcn-helper/references/framework-reference.md and docs/specs/tier-2/sfmc-next-target-adapter.md — the target-side model. Source-side HubSpot detail is consultant platform knowledge with no manifest behind it, which is exactly what this pack's interview_only posture declares on the readout.
