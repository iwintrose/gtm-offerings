# SUPPLEMENT SET — sfmc_classic_readiness. Fires when the target is classic
# Marketing Cloud Engagement.
#
# Same job as mcn_readiness and the same reason for existing: "how hard is this
# estate to move" and "does the destination tenant exist in a state that can
# receive it" are different questions, and adding them would make one number
# mean two things. These three scored questions produce their own index (3-9)
# and never touch the 32.
#
# What is NOT here is the reason this set is short. MCN's prerequisite stack is
# a platform that has to be stood up -- Data Cloud, Core, consumption model --
# so mcn_readiness asks four scored questions about whether it exists yet. MCE
# is a mature product; its prerequisites are tenant CONFIGURATION rather than a
# platform build, and there are exactly three pieces of it that decide whether a
# migration can start: how many (instance, business unit) targets there are,
# whether Contact Builder has an agreed subscriber model, and whether the
# suppression infrastructure that classic SFMC uses INSTEAD of a journey loop
# has been built. Padding it out to four to match mcn_readiness would be
# symmetry bought with a question nobody needs answered.
#
# The fourth and fifth entries are unscored, and deliberately so -- see their
# rationales. Both are forward-looking: they capture what the client wants NEXT
# from the Salesforce stack, which is a different thing from whether the MCE
# tenant can receive a migration now, and neither is allowed near an index.

set_key: sfmc_classic_readiness
index_key: sfmc_classic_readiness_index
label: Marketing Cloud Engagement tenant readiness

questions:
  - key: target_bu_structure
    sort_order: 10
    scored: true
    horizon_driver: true
    question: >-
      What does the destination tenant look like today — is there an MCE
      instance, does it have a business-unit structure, and is it agreed which
      brand or region lands in which BU?
    options:
      - value: 1
        label: "No MCE tenant provisioned, or one exists that nobody administers. Business-unit structure is undecided."
      - value: 2
        label: "A tenant and some business units exist, but which brand, region or source instance lands where has not been agreed."
      - value: 3
        label: "Tenant and business units are live and administered, and every brand or region has an agreed destination BU."
    rationale: >-
      docs/specs/tier-2/sfmc-target-adapter.md §7.1 — "Each SFMCTargetAdapter.generate() invocation is scoped to one (target SFMC instance, business unit) pair. The adapter does not iterate across instances or BUs", and §7 opening, "a representative engagement might span 5 source instances -> 3 target instances with several BUs each". The BU map is therefore not tenant trivia: it is the count of adapter runs and of parallel build tracks, which is why this one carries horizon_driver. Named target_bu_structure rather than business_unit_structure because the latter is already a scored ESTATE COMPLEXITY dimension asking the opposite question — how the SOURCE account is split — and rule 6 exists to stop a supplement quietly landing on a scored key. The same spec's out-of-scope list names "Business Unit setup / provisioning, IP warm-up, CRM connector config" as tenant config that is gap-doc'd, not generated — so if it does not exist, somebody has to build it before the accelerator has anywhere to write.

  - key: contact_builder_state
    sort_order: 20
    scored: true
    question: >-
      In Marketing Cloud, is there an agreed subscriber key and a modelled set
      of sendable data extensions — or would the audience model be designed
      from scratch as part of this migration?
    options:
      - value: 1
        label: "Nothing modelled. No agreed subscriber key, no sendable data extensions, no attribute sets."
      - value: 2
        label: "Some sendable DEs exist for tactical sends, built ad hoc. No agreed subscriber key and no attribute-set design."
      - value: 3
        label: "A subscriber key is agreed, sendable DEs and attribute sets are modelled, and Contact Builder is the audience source of truth."
    rationale: >-
      docs/specs/tier-2/sfmc-target-adapter.md — T-4, "The adapter does NOT generate Data Extension schemas. The user models DEs themselves ... The adapter documents the requirements and relationships: this Journey needs a sendable entry DE keyed on SubscriberKey with these columns", and the division-of-labour table, "Data Extensions | Writes Markdown gap docs | Builds DEs in Contact Builder following the docs". capabilities/platforms/sfmc.yaml — entry_sources are api_event, data_extension, salesforce_data and audience_studio, every one of which presumes a subscriber model already decided. This is the single largest piece of work the accelerator explicitly does NOT do for you, which is why it is asked before it is discovered.

  - key: frequency_capping_infrastructure
    sort_order: 30
    scored: true
    question: >-
      Is there a send-frequency policy, and does the suppression infrastructure
      that enforces it exist in the target tenant yet?
    options:
      - value: 1
        label: "No policy and no infrastructure. How often a contact is mailed is whatever the campaign calendar produces."
      - value: 2
        label: "A cap policy exists — in the current platform's settings or on paper — but nothing is built target-side to enforce it."
      - value: 3
        label: "The suppression data extension and its automation are in place target-side, and the cap windows are agreed."
    rationale: >-
      capabilities/platforms/sfmc.yaml — infrastructure.frequency_capping names the exact artefacts ("ENT - Email Frequency Suppression" DE, NextEligibleDate field, "ENT - Email Frequency Filter Suppression" automation running hourly against weekly and monthly caps), and gap_patterns traffic_control_loop makes the point this question exists for: in SFMC, capping is INFRASTRUCTURE, not something a journey expresses. migration-accelerator/capabilities/platforms/hubspot.yaml — the sending.frequency_capping block, where HubSpot's cap is an account-level setting with a per-email override, i.e. a checkbox the client will assume comes with them. It does not; something has to be built, and this asks whether it has been.

  - key: forward_looking_ambitions
    sort_order: 40
    scored: false
    question: >-
      Looking past this migration: is there anything you are hoping to get from
      the wider Salesforce stack later — Marketing Cloud Next capabilities, or
      Data 360 / Data Cloud as the eventual home for your data model — rather
      than from Marketing Cloud Engagement itself? Tell us which use cases those
      ambitions are attached to.
    rationale: >-
      ONE PROBE, FROM TWO. Until this merge, migration-accelerator/instrument/migration-accelerator/supplements/sfmc_classic_readiness.yaml
      asked mcn_forward_use_cases ("capabilities you are expecting from Marketing
      Cloud Next rather than the platform you're migrating onto") and, two
      questions later, data_360_forward_option ("pointed at Data 360 / Data Cloud
      as the eventual home"). They are the same question — what are you hoping for
      later — put twice to someone who has just been told this migration targets
      Marketing Cloud Engagement, and a respondent who answered the first honestly
      had nothing to add to the second. Merged rather than dropped because both
      halves earn their place: the capability half and the data-model half of a
      forward-looking wish are different sentences and the readout's roadmap
      section uses both. UNSCORED, for the reason both parents were unscored, and
      it is the same sentence: migration-accelerator/instrument/migration-accelerator/supplements/mcn_readiness.yaml
      states the precedent verbatim in shared_audience_definitions — "Left UNSCORED
      on purpose ... every 1-3 banding of it that was tried lost the thing that made
      it discriminating." Here the reason is stronger than precedent. The migration
      target is Marketing Cloud Engagement; scoring a wish list for a DIFFERENT
      platform into this tenant's readiness index would state that MCN is the
      destination when it is not, and a classic MCE migration requires no Data Cloud
      at all — see migration-accelerator/instrument/migration-accelerator/pairs/hubspot_to_sfmc.yaml slot 5,
      whose top of scale is a decomposable object graph (subscriber key, sendable
      data extensions, Contact Builder attribute sets) precisely because classic MCE
      asks for no unified profile, and docs/specs/tier-2/sfmc-target-adapter.md, whose
      target-side ask is "this Journey needs a sendable entry DE keyed on SubscriberKey
      with these columns" and nothing more. migration-accelerator/instrument/migration-accelerator/supplements/mcn_readiness.yaml
      scores data_cloud_state because on an MCN target Data Cloud IS the prerequisite
      stack (skills/mce-mcn-helper/references/skills/10-roadmap.md, Step 2, foundation
      gates every other lane); importing that scoring here would mark a client with no
      Data Cloud plans as unready for a platform that never asked for it. What this
      produces is a verbatim note attributed to the use case, feeding a forward-looking
      paragraph and nothing else. See docs/specs/tier-2/sfmc-next-target-adapter.md for
      what MCN would actually require, none of which is in scope on this pair.
