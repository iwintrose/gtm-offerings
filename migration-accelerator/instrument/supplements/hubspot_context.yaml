# SUPPLEMENT SET — hubspot_context. Three unscored probes, all of which exist
# because they name scope that routinely goes missing until it is expensive.
#
# None is scored. All three are questions whose answer is a fact about someone
# else's budget, and a 1-3 on someone else's budget is a number with no owner.

set_key: hubspot_context
index_key: null
label: HubSpot scope boundaries

questions:
  - key: sequences_ownership
    sort_order: 10
    scored: false
    question: >-
      Does Sales own HubSpot Sequences, and does anyone consider them in scope
      for this migration?
    rationale: docs/specs/tier-2/sfmc-next-target-adapter.md — the adapter's scope boundary is marketing orchestration; sales-engagement tooling is not in the source or target surface it addresses. Asked verbatim rather than scored because the answer is usually "nobody has asked Sales", and that sentence is the finding.

  - key: reporting_signoff
    sort_order: 20
    scored: false
    question: >-
      When marketing reporting changes shape, who signs it off?
    rationale: skills/mce-mcn-helper/references/skills/02-maturity.md — diagnostic questions 5 and 6, "How do you measure whether marketing is working?" and "Who owns your customer data model?", where the Stage 2 answer is per-journey reporting owned inside marketing and the Stage 3 answer is a shared layer with a named owner. In a HubSpot estate the reporting layer and the CRM are the same product, so the sign-off owner is frequently outside marketing entirely.

  - key: cms_scope_expectation
    sort_order: 30
    scored: false
    question: >-
      Do you expect your landing pages, site pages, blog or any HubDB-driven
      content to move as part of this — and if they do not, what happens to
      HubSpot CMS afterwards: kept and paid for, or replaced on its own
      timeline?
    rationale: >-
      migration-accelerator/instrument/pairs/hubspot_to_sfmc.yaml — slot 4, which was
      rescoped to marketing email templates and personalisation only, and this probe
      is where the other half went. HubL is HubSpot's templating language and custom
      modules are the blocks built from it, and they are used in two migrations, not
      one: marketing emails are rebuilt in Content Builder by this engagement, while
      landing pages, site pages, blog and HubDB-driven pages are HubSpot CMS, which a
      marketing-automation move to Marketing Cloud Engagement typically does not touch
      — the client keeps HubSpot CMS or moves the web estate as a separate programme
      with its own sponsor. Scoring readiness on that overstated the engagement, so
      the scored slot dropped it and this asks it instead. UNSCORED for the same reason
      forward_looking_ambitions in migration-accelerator/instrument/supplements/sfmc_classic_readiness.yaml
      is unscored, and the reason is the same sentence: it is a scope-boundary question,
      not a readiness measure. A 1-3 would state that keeping HubSpot CMS is a degree of
      unreadiness, when it is frequently the correct and cheapest answer. Its output is a
      verbatim note feeding the readout's scope section, and it is the answer the
      hubdb_dependency callout in migration-accelerator/instrument/pairs/hubspot_to_sfmc.yaml
      is now explicitly conditional on. Asked before contract because the failure mode is
      a client who assumed their website was coming along finding out in week three.
